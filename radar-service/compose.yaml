services:
  rich-radar:
    build:
      context: ..
      dockerfile: radar-service/Dockerfile
    restart: unless-stopped
    env_file: .env
    volumes:
      - radar-state:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
volumes:
  radar-state:
