# Cloudflare Worker 설정 파일
# ⚠️ 이 파일은 GitHub에 올라갑니다. 비밀키/토큰을 절대 여기에 적지 마세요.
#    비밀값은 Cloudflare 대시보드 > Worker > Settings > Variables and Secrets 에서 "Secret"으로 등록합니다.

# Cloudflare에 이미 만들어 둔 Worker 이름과 반드시 같아야 합니다.
name = "coin-radar-engine"
main = "src/index.js"
compatibility_date = "2025-09-01"

# 로그(Observability)를 켜서 대시보드에서 오류를 볼 수 있게 합니다.
[observability]
enabled = true

# 실험: Cloudflare 공식 Placement Hint
# Worker를 AWS 서울 리전(ap-northeast-2)과 가장 가까운 Cloudflare 데이터센터에서 실행하도록 요청합니다.
# /debug/reachability 결과가 달라지는지 확인하기 위한 설정이며, 효과가 없으면 이 블록만 삭제하면 됩니다.
[placement]
region = "aws:ap-northeast-2"

# PR Preview 빌드(wrangler preview)용 설정. Preview에도 같은 서울 리전 Placement Hint를 적용합니다.
[previews.placement]
region = "aws:ap-northeast-2"
