# Cloudflare Worker 설정 파일
# ⚠️ 이 파일은 GitHub에 올라갑니다. 비밀키/토큰을 절대 여기에 적지 마세요.
#    비밀값은 Cloudflare 대시보드 > Worker > Settings > Variables and Secrets 에서 "Secret"으로 등록합니다.

# Cloudflare에 이미 만들어 둔 Worker 이름과 반드시 같아야 합니다.
name = "coin-radar-engine"
main = "src/index.js"
compatibility_date = "2025-09-01"

# 로그(Observability)를 켜서 대시보드에서 오류를 볼 수 있게 합니다.
[observability]
enabled = true

# 실험: Cloudflare 공식 Placement Hint
# Worker를 AWS 서울 리전(ap-northeast-2)과 가장 가까운 Cloudflare 데이터센터에서 실행하도록 요청합니다.
# /debug/reachability 결과가 달라지는지 확인하기 위한 설정이며, 효과가 없으면 이 블록만 삭제하면 됩니다.
[placement]
region = "aws:ap-northeast-2"

# PR Preview 빌드(wrangler preview)용 설정. Preview에도 같은 서울 리전 Placement Hint를 적용합니다.
[previews.placement]
region = "aws:ap-northeast-2"

# ─────────────────────────────────────────────
# Phase 4: Upbit 24시간 감시 (docs/MONITOR.md)
# ─────────────────────────────────────────────
# Cron Trigger: 1분마다 실행 (Cloudflare Cron 의 가장 짧은 주기).
# 무료 플랜은 계정 전체에서 Cron Trigger 5개까지 사용할 수 있으며, 이 설정은 그중 1개를 사용합니다.
[triggers]
crons = ["* * * * *"]

# 비밀이 아닌 설정값. (비밀값은 여기에 넣지 말고 Cloudflare Secret 으로 등록)
# 필요한 Secret: 없음 (외부 메신저 알림 제거됨. 예전에 등록한 Secret 이 있어도 사용하지 않음)
# MONITOR_MARKETS: 감시할 Upbit KRW 종목 수 (24H 거래대금 상위). 최대 20.
[vars]
MONITOR_MARKETS = "15"

# D1 데이터베이스 연결 (production 전용). 코드에서는 env.DB 로 사용합니다.
# database_id 는 비밀번호가 아니며 공개 저장소에 있어도 됩니다 (접근은 Cloudflare 계정 권한으로 보호).
#
# ⚠️ PR Preview 빌드에는 D1 을 연결하지 않습니다.
#    Preview 는 위 [previews] 블록에 적힌 바인딩만 사용하므로(최상위 d1_databases 를 물려받지 않음),
#    Preview 에서는 env.DB 가 없어 D1 저장을 하지 않고 production D1 도 건드리지 않습니다.
#    ([previews] 에 d1_databases 를 추가하지 마세요.)
[[d1_databases]]
binding = "DB"
database_name = "coin-radar"
database_id = "da52848c-cece-4580-bac2-c02d957fa468"
