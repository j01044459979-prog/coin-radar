<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<base target="_top">
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#1c2430;--mute:#6b7685;--pri:#2457d6;--ok:#16794c;--err:#c0392b;--line:#e3e7ee}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,"Noto Sans KR",sans-serif;padding-bottom:76px}
header{background:var(--pri);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center}
header b{font-size:17px}header small{opacity:.85;display:block;font-size:12px}
header button{background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:8px;padding:6px 10px}
main{padding:12px 16px;max-width:640px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
h2{font-size:16px;margin:0 0 10px}label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;background:#fff}
.btn{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:12px 14px;width:100%;margin-top:12px;font-weight:600}
.btn.sec{background:#e8edf8;color:var(--pri)}.btn.sm{width:auto;padding:6px 10px;margin:0;font-size:13px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;border:0;background:none;padding:10px 0 8px;color:var(--mute);font-size:12px}nav button span{display:block;font-size:20px}nav button.on{color:var(--pri);font-weight:700}
.row{display:flex;gap:8px}.row>*{flex:1}.item{border-top:1px solid var(--line);padding:10px 0}.item:first-child{border-top:0}
.tag{display:inline-block;background:#eef2fb;color:var(--pri);border-radius:6px;padding:1px 7px;font-size:12px;margin-right:4px}
.mute{color:var(--mute);font-size:13px}.err{color:var(--err);font-size:13px;min-height:18px}.ok{color:var(--ok)}
#login{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;align-items:center;justify-content:center;padding:20px}
#login .card{width:100%;max-width:360px}.hide{display:none!important}
.bars{display:flex;align-items:flex-end;gap:2px;height:90px;margin:8px 0}.bars i{flex:1;background:var(--pri);min-height:2px;border-radius:2px 2px 0 0}.bars i.q{background:#e39b1c}
.big{font-size:24px;font-weight:700}.kv{display:flex;justify-content:space-between;padding:4px 0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.chips button{border:1px solid var(--line);background:#fff;border-radius:16px;padding:5px 11px;font-size:13px}.chips button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
</style></head><body>
<div id="login"><div class="card"><h2>관저중로점 AI 외부활동</h2>
<p class="mute">직원 비밀번호를 입력하세요.</p>
<input id="pw" type="password" inputmode="numeric" autocomplete="off" placeholder="비밀번호">
<div class="err" id="lerr"></div><button class="btn" id="lbtn">입장</button></div></div>

<header><div><b>관저중로점 AI 외부활동</b><small id="addr"></small></div><button id="out">로그아웃</button></header>
<main id="main"></main>
<nav>
<button data-t="today"><span>🏠</span>오늘</button>
<button data-t="log"><span>📋</span>활동기록</button>
<button data-t="staff"><span>👥</span>직원활동</button>
<button data-t="stats"><span>📊</span>분석</button>
</nav>
<script>
var DEV=(function(){try{var d=localStorage.getItem('dev');if(!d){d=(self.crypto&&crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2)+Date.now()).replace(/[^A-Za-z0-9-]/g,'');localStorage.setItem('dev',d)}return d}catch(e){return 'anon'}})();
var S={token:null,boot:null,tab:'today',admin:true,edit:null};
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function call(fn){var a=[].slice.call(arguments,1);return new Promise(function(res,rej){google.script.run.withSuccessHandler(function(r){
  if(r&&r.session===false){toLogin('세션이 만료되었습니다. 다시 로그인하세요.');}res(r)}).withFailureHandler(function(e){rej(e)})[fn].apply(null,a)})}
function api(fn){return call.apply(null,[fn,S.token].concat([].slice.call(arguments,1)))}
function toLogin(msg){S.token=null;S.admin=true;try{sessionStorage.removeItem('t')}catch(e){}$('#login').classList.remove('hide');$('#lerr').textContent=msg||'';$('#pw').value=''}
$('#lbtn').onclick=doLogin;$('#pw').onkeydown=function(e){if(e.key==='Enter')doLogin()};
function doLogin(){var b=$('#lbtn');b.disabled=true;call('login',$('#pw').value,DEV).then(function(r){b.disabled=false;
 if(!r.ok){$('#lerr').textContent=r.error||'로그인 실패';return}
 S.token=r.token;try{sessionStorage.setItem('t',r.token)}catch(e){}start()}).catch(function(){b.disabled=false;$('#lerr').textContent='서버 연결 실패'})}
$('#out').onclick=function(){call('logout',S.token).then(function(){toLogin('로그아웃되었습니다.')})};
function start(){api('getBootstrap').then(function(r){if(!r||!r.ok)return;S.boot=r;$('#login').classList.add('hide');$('#addr').textContent=r.store.address;show(S.tab)})}
document.querySelectorAll('nav button').forEach(function(b){b.onclick=function(){show(b.dataset.t)}});
function show(t){S.tab=t;document.querySelectorAll('nav button').forEach(function(b){b.classList.toggle('on',b.dataset.t===t)});
 ({today:vToday,log:vLog,staff:vStaff,stats:vStats})[t]()}
function setMain(h){$('#main').innerHTML=h}
function opts(a,sel){return a.map(function(x){return '<option'+(x===sel?' selected':'')+'>'+esc(x)+'</option>'}).join('')}
function ymd(d){var z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)}

function needAdmin(render){render()}

/* ── 오늘 / 입력 ── */
function form(a){a=a||{};var b=S.boot,apt=b.apartments.filter(function(x){return x.id===a.aptId})[0];
 return '<label>활동일</label><input type="date" id="f_date" value="'+esc(a.date||b.today)+'">'+
 '<label>담당 직원</label><select id="f_staff">'+opts(b.staff,a.staff)+'</select>'+
 '<label>아파트명</label><select id="f_apt"><option value="">선택</option>'+b.apartments.map(function(x){return '<option value="'+x.id+'"'+(x.id===a.aptId?' selected':'')+'>'+esc(x.name)+'</option>'}).join('')+'</select>'+
 '<div class="mute" id="f_dl"></div>'+
 '<label>완료한 동 (예: 202동, 203동)</label><input id="f_dongs" value="'+esc(a.dongs||'')+'" placeholder="202동, 203동">'+
 '<div class="row"><div><label>아파트 형태</label><select id="f_type">'+opts(b.types,a.type||'미확인')+'</select></div>'+
 '<div><label>공동현관 비밀번호</label><select id="f_entry">'+opts(b.entries,a.entry||'미확인')+'</select></div></div>'+
 '<label>메모 (고객 개인정보 입력 금지)</label><textarea id="f_memo" rows="2" maxlength="300">'+esc(a.memo||'')+'</textarea>'+
 '<div class="err" id="f_err"></div>'}
function bindForm(){var sel=$('#f_apt');function dl(){var a=S.boot.apartments.filter(function(x){return x.id===sel.value})[0];$('#f_dl').textContent=a?'동 목록: '+a.dongs:''}
 sel.onchange=function(){var a=S.boot.apartments.filter(function(x){return x.id===sel.value})[0];if(a){if(a.type)$('#f_type').value=a.type;if(a.entry)$('#f_entry').value=a.entry}dl()};dl()}
function readForm(){return{date:$('#f_date').value,staff:$('#f_staff').value,aptId:$('#f_apt').value,dongs:$('#f_dongs').value,type:$('#f_type').value,entry:$('#f_entry').value,memo:$('#f_memo').value}}
function vToday(){var b=S.boot;setMain('<div class="card"><h2>활동 등록</h2>'+form()+'<button class="btn" id="save">저장</button></div><div id="tl"></div>');bindForm();
 $('#save').onclick=function(){$('#save').disabled=true;api('addActivity',readForm()).then(function(r){$('#save').disabled=false;if(r.ok)vToday();else if(r.session!==false)$('#f_err').textContent=r.error})};
 api('listActivities',{from:b.today,to:b.today}).then(function(r){if(r.ok)$('#tl').innerHTML='<div class="card"><h2>오늘 기록 ('+r.items.length+'건, '+r.items.reduce(function(s,x){return s+x.count},0)+'개 동)</h2>'+(r.items.map(row).join('')||'<div class="mute">오늘 등록된 활동이 없습니다.</div>')+'</div>';bindRows()})}
function row(x){return '<div class="item"><span class="tag">'+esc(x.staff)+'</span><b>'+esc(x.aptName)+'</b> <span class="mute">'+esc(x.date)+'</span><div>'+esc(x.dongs)+' <span class="mute">('+x.count+'개 동 · '+esc(x.type)+' · 현관 '+esc(x.entry)+')</span></div>'+(x.memo?'<div class="mute">'+esc(x.memo)+'</div>':'')+
 '<button class="btn sec sm" data-e="'+esc(x.id)+'">수정</button>'+(S.admin?' <button class="btn sec sm" data-d="'+esc(x.id)+'">삭제</button>':'')+'</div>'}
var CACHE={};
function bindRows(items){document.querySelectorAll('[data-e]').forEach(function(b){b.onclick=function(){api('listActivities',{}).then(function(r){var x=r.items.filter(function(i){return i.id===b.dataset.e})[0];if(x)editView(x)})}});
 document.querySelectorAll('[data-d]').forEach(function(b){b.onclick=function(){if(confirm('이 기록을 삭제할까요?'))api('deleteActivity',b.dataset.d).then(function(r){if(r.ok)show(S.tab);else alert(r.error)})}})}
function editView(x){setMain('<div class="card"><h2>활동 수정</h2>'+form(x)+'<button class="btn" id="upd">수정 저장</button><button class="btn sec" id="cx">취소</button></div>');bindForm();
 $('#cx').onclick=function(){show(S.tab)};$('#upd').onclick=function(){api('updateActivity',x.id,readForm()).then(function(r){if(r.ok)show(S.tab);else if(r.session!==false)$('#f_err').textContent=r.error})}}

/* ── 활동기록 ── */
function vLog(){var b=S.boot,to=b.today,from=ymd(new Date(Date.now()-6*864e5));
 setMain('<div class="card"><h2>활동기록 조회</h2><div class="row"><input type="date" id="lf" value="'+from+'"><input type="date" id="lt" value="'+to+'"></div>'+
 '<div class="row"><select id="ls"><option value="">전체 직원</option>'+opts(b.staff)+'</select><select id="la"><option value="">전체 아파트</option>'+b.apartments.map(function(x){return '<option value="'+x.id+'">'+esc(x.name)+'</option>'}).join('')+'</select></div>'+
 '<button class="btn sec" id="lq">조회</button></div><div id="lr"></div>');
 function q(){api('listActivities',{from:$('#lf').value,to:$('#lt').value,staff:$('#ls').value,aptId:$('#la').value}).then(function(r){if(!r.ok)return;
  var by={};r.items.forEach(function(x){(by[x.date]=by[x.date]||[]).push(x)});
  $('#lr').innerHTML=Object.keys(by).sort().reverse().map(function(d){var t=by[d].reduce(function(s,x){return s+x.count},0);return '<div class="card"><h2>'+d+' <span class="mute">'+t+'개 동</span></h2>'+by[d].map(row).join('')+'</div>'}).join('')||'<div class="card mute">기록이 없습니다.</div>';bindRows()})}
 $('#lq').onclick=q;q()}

/* ── 직원활동 ── */
function vStaff(){needAdmin(function(){var to=S.boot.today,from=ymd(new Date(Date.now()-29*864e5));
 setMain('<div class="card"><h2>직원활동 (최근 30일)</h2><div id="sr" class="mute">불러오는 중…</div></div><div class="card"><h2>아파트 DB 관리</h2><div id="ar"></div></div>');
 api('staffActivity',from,to).then(function(r){if(!r.ok)return needAdminFail(r);$('#sr').innerHTML=r.items.map(function(x){return '<div class="item"><b>'+esc(x.staff)+'</b><div>'+x.dongs+'개 동 · '+x.records+'건 · '+x.days+'일 활동 <span class="mute">최근 '+esc(x.last||'-')+'</span></div></div>'}).join('')});
 $('#ar').innerHTML=S.boot.apartments.map(function(a){return '<div class="item"><b>'+esc(a.name)+'</b> <span class="mute">누적 '+a.total+'개 동 · 최근 '+esc(a.last||'-')+'</span><div class="mute">'+esc(a.type)+' · 현관 '+esc(a.entry)+(a.memo?' · '+esc(a.memo):'')+'</div></div>'}).join('')})}
function needAdminFail(r){}

/* ── 분석 ── */
function vStats(){needAdmin(function(){var chips=[['이번 주',0],['최근 7일',7],['최근 30일',30],['최근 90일',90]];
 setMain('<div class="chips" id="ch">'+chips.map(function(c,i){return '<button data-i="'+i+'">'+c[0]+'</button>'}).join('')+'</div><div id="sr"></div>');
 function run(i){document.querySelectorAll('#ch button').forEach(function(b,k){b.classList.toggle('on',k===i)});var now=new Date(),to=ymd(now),from;
  if(i===0){var d=new Date(now);d.setDate(d.getDate()-((d.getDay()+6)%7));from=ymd(d)}else from=ymd(new Date(Date.now()-(chips[i][1]-1)*864e5));
  $('#sr').innerHTML='<div class="mute">불러오는 중…</div>';
  api('analytics',from,to).then(function(r){if(!r.ok){$('#sr').innerHTML='<div class="err">'+esc(r.error)+'</div>';return}render(r)})}
 document.querySelectorAll('#ch button').forEach(function(b){b.onclick=function(){run(+b.dataset.i)}});run(1)})}
function delta(a,b){var d=a-b;return (d>0?'+':'')+d}
function render(r){var mx=Math.max.apply(null,r.daily.map(function(x){return Math.max(x.dongs,x.qr)}).concat([1]));
 function bars(k,c){return '<div class="bars">'+r.daily.map(function(x){return '<i class="'+c+'" style="height:'+Math.round(x[k]/mx*100)+'%" title="'+x.date+': '+x[k]+'"></i>'}).join('')+'</div>'}
 $('#sr').innerHTML=
 '<div class="card"><h2>기간 요약 <span class="mute">'+r.from+' ~ '+r.to+'</span></h2><div class="row"><div><div class="big">'+r.current.dongs+'</div><div class="mute">완료 동 수 ('+delta(r.current.dongs,r.previous.dongs)+')</div></div><div><div class="big">'+r.current.qr+'</div><div class="mute">QR① 유입 ('+delta(r.current.qr,r.previous.qr)+')</div></div></div>'+
 '<div class="mute" style="margin-top:6px">직전 동일 기간('+r.previousRange[0]+' ~ '+r.previousRange[1]+'): 동 '+r.previous.dongs+' · 활동 '+r.previous.records+'건 · QR '+r.previous.qr+'</div></div>'+
 '<div class="card"><h2>일별 완료 동 수</h2>'+bars('dongs','')+'</div>'+
 '<div class="card"><h2>일별 QR① 유입</h2>'+bars('qr','q')+'<div class="mute">'+esc(r.note)+'</div></div>'+
 '<div class="card"><h2>활동량 대비 QR 유입 추이</h2><div class="bars">'+r.daily.map(function(x){return '<i style="height:'+Math.round(x.dongs/mx*100)+'%;background:var(--pri)"></i><i class="q" style="height:'+Math.round(x.qr/mx*100)+'%"></i>'}).join('')+'</div><div class="mute">파랑: 완료 동 · 주황: QR① 유입</div></div>'+
 '<div class="card"><h2>직원별 활동량</h2>'+(r.staff.map(function(s){return '<div class="kv"><span>'+esc(s.staff)+'</span><b>'+s.dongs+'개 동</b></div>'}).join('')||'<div class="mute">데이터 없음</div>')+'</div>'+
 '<div class="card"><h2>아파트별 활동 이력</h2>'+(r.apartments.map(function(a){return '<div class="item"><b>'+esc(a.name)+'</b> <span class="mute">'+a.dongs+'개 동 · '+a.records+'건</span><div class="mute">'+a.history.map(function(h){return esc(h.date.slice(5))+' '+esc(h.staff)+' '+esc(h.dongs)}).join(' / ')+'</div></div>'}).join('')||'<div class="mute">데이터 없음</div>')+'</div>'}

try{var t=sessionStorage.getItem('t');if(t){S.token=t;start()}}catch(e){}
</script></body></html>
