name: telegram-image-test
# 일회용 신호 이미지 테스트(가상 데이터). 실행 직후 이 파일들을 삭제한다. .github/image-test.mode 가 dry 이면 렌더링만, send 이면 사진 1장 전송.
# 운영 radar·스케줄·상태 캐시·모의매매 장부와 무관하다(캐시 복원/저장 단계 없음, 주문 기능 없음).
on:
  push:
    branches: ['claude/coin-radar-handoff-8f4oju']
    paths: ['.github/workflows/telegram-image-test.yml', '.github/telegram-image-test.mjs', '.github/image-test.mode']
permissions:
  contents: read
concurrency:
  group: telegram-image-test
  cancel-in-progress: false
jobs:
  run:
    if: github.repository == 'j01044459979-prog/coin-radar' && github.ref == 'refs/heads/claude/coin-radar-handoff-8f4oju'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install chart dependency
        run: npm ci --prefix radar-service --no-audit --no-fund
      - name: Image test (dry = render only, send = ONE photo)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: MODE="$(tr -d '[:space:]' < .github/image-test.mode)" node .github/telegram-image-test.mjs
