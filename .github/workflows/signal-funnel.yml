name: signal-funnel
# 신호 생성 단계별 탈락·실행 간격·대체 전략 과거 데이터 검증(읽기 전용): 공개 OKX 시세로 계산해 출력만 한다.
# Telegram 비밀값·쓰기 권한·상태 캐시·주문이 없고 운영 radar 워크플로, 스케줄, Cloudflare와 무관하다. 진단 전용 브랜치에서만 실행되며 main에 병합하지 않는다.
on:
  push:
    branches: ['diag/signal-funnel']
    paths: [.github/workflows/signal-funnel.yml, radar-service/signal/funnel*.mjs, radar-service/signal/alt-strategies.mjs]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: signal-funnel
  cancel-in-progress: true
jobs:
  funnel:
    if: github.repository == 'j01044459979-prog/coin-radar'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        top: [20, 30]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        run: node --test radar-service/test/signal-alt.test.mjs radar-service/test/signal-backtest.test.mjs radar-service/test/signal.test.mjs
      - name: Funnel + strategies (public OKX data, no Telegram)
        run: node radar-service/signal/funnel-cli.mjs --top "${{ matrix.top }}" --days 120 | tee "$RUNNER_TEMP/funnel.txt"
      - name: Summary
        run: |
          { echo "### Signal funnel · top ${{ matrix.top }} (read-only)"; grep -v '^JSON ' "$RUNNER_TEMP/funnel.txt"; } >> "$GITHUB_STEP_SUMMARY"
