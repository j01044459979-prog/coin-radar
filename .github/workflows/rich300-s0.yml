name: rich300-s0
# RICH 300 S0 실측(일회용). 개발 브랜치 전용·읽기 전용·스케줄 없음·radar와 무관. 시험용 Apps Script 배포 URL(Secret RICH300_S0_API_URL)에만 요청한다.
# Secret이 없으면 아무것도 하지 않고 성공 종료한다. 로그에는 URL·본문을 출력하지 않고 집계 결과만 남긴다.
on:
  push:
    branches: [test/rich300-s0-measurements]
    paths: ['.github/workflows/rich300-s0.yml', 'rich300/s0/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rich300-s0
  cancel-in-progress: false
jobs:
  probe:
    if: github.repository == 'j01044459979-prog/coin-radar' && github.ref == 'refs/heads/test/rich300-s0-measurements'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe tests (offline)
        run: node --test rich300/test/*.test.mjs
      - name: S0 probe against test deployment
        env:
          RICH300_S0_API_URL: ${{ secrets.RICH300_S0_API_URL }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { run } from './rich300/s0/probe.mjs';
          const r = await run({ url: process.env.RICH300_S0_API_URL });
          assert.equal(r.skipped, undefined, 'S0 URL must be configured');
          const c = r.checks;
          assert.equal(c.signature?.sigOk, true, 'Unicode HMAC');
          assert.equal(c.signature?.tsOk, true, 'timestamp');
          assert.equal(c.tamperRejected, true, 'tamper rejection');
          assert.equal(c.staleTsRejected, true, 'stale timestamp rejection');
          assert.equal(c.executionsForThreePosts, 3, 'no duplicate POST on redirect');
          assert.equal(c.lockAndCounter?.lockedCorrectly, true, 'parallel lock/counter');
          assert.equal(c.appendMsSample?.n, 8, 'authenticated writes');
          assert.equal(c.postRedirect?.firstStatus, 302);
          assert.equal(c.postRedirect?.finalStatus, 200);
          assert.ok(Array.isArray(c.headersVisible?.eventKeys), 'successful handler evidence');
          JS
