    branches: ['feat/early-long-pullback-sweep-20261126']
    paths: ['radar-service/signal/early-long-research.mjs','radar-service/signal/ema-pullback.mjs','.github/workflows/early-long-research.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
