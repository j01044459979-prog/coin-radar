<!DOCTYPE html>
<html>
<head>
  <base target="_top">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  >

  <style>
    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      background:#f4f6f9;
      color:#111827;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans KR",
        Arial,
        sans-serif;
      padding-bottom:90px;
    }

    button,
    input,
    select,
    textarea{
      font:inherit;
    }

    button{
      cursor:pointer;
    }

    .app{
      width:100%;
      max-width:760px;
      margin:0 auto;
      min-height:100vh;
    }

    .topbar{
      position:sticky;
      top:0;
      z-index:50;
      background:#ffffff;
      border-bottom:1px solid #e5e7eb;
      padding:14px 16px 12px;
    }

    .top-title{
      font-size:20px;
      font-weight:900;
      line-height:1.2;
      margin-bottom:10px;
    }

    .top-row{
      display:flex;
      gap:8px;
      align-items:center;
    }

    .top-row select{
      flex:1;
      min-width:0;
      height:42px;
      border:1px solid #d1d5db;
      border-radius:12px;
      background:#fff;
      padding:0 12px;
      font-weight:700;
    }

    .refresh-btn{
      height:42px;
      border:0;
      border-radius:12px;
      background:#111827;
      color:#fff;
      padding:0 15px;
      font-weight:800;
      white-space:nowrap;
    }

    .page{
      display:none;
      padding:16px;
    }

    .page.active{
      display:block;
    }

    .section-title{
      font-size:18px;
      font-weight:900;
      margin:0 0 12px;
    }

    .section-sub{
      color:#6b7280;
      font-size:13px;
      line-height:1.5;
      margin:-5px 0 14px;
    }

    .summary-grid{
      display:grid;
      grid-template-columns:
        repeat(2,minmax(0,1fr));
      gap:10px;
      margin-bottom:16px;
    }

    .summary{
      background:#fff;
      border:1px solid #e5e7eb;
      border-radius:16px;
      padding:14px;
      min-width:0;
    }

    .summary .label{
      color:#6b7280;
      font-size:12px;
      font-weight:700;
      margin-bottom:6px;
    }

    .summary .value{
      font-size:20px;
      font-weight:900;
      overflow-wrap:anywhere;
    }

    .budget-row{
      display:flex;
      justify-content:space-between;
      align-items:baseline;
      gap:12px;
      padding:9px 0;
    }

    .budget-row .label{
      color:#6b7280;
      font-size:14px;
      font-weight:700;
      flex:0 1 auto;
      min-width:0;
    }

    .budget-row .value{
      font-size:18px;
      font-weight:900;
      text-align:right;
      white-space:nowrap;
    }

    .budget-row.total .label{
      color:#111827;
    }

    .budget-sep{
      border-top:1px solid #e5e7eb;
      margin:6px 0;
    }

    .panel{
      background:#fff;
      border:1px solid #e5e7eb;
      border-radius:18px;
      padding:16px;
      margin-bottom:14px;
    }

    .filter-row{
      display:flex;
      gap:8px;
      margin-bottom:12px;
    }

    .filter-row select{
      flex:1;
      height:42px;
      border:1px solid #d1d5db;
      border-radius:12px;
      background:#fff;
      padding:0 12px;
    }

    .employee-list{
      display:grid;
      gap:10px;
    }

    .employee-card{
      background:#fff;
      border:1px solid #e5e7eb;
      border-radius:16px;
      padding:14px;
    }

    .employee-name{
      font-size:16px;
      font-weight:900;
      margin-bottom:12px;
    }

    .mini-grid{
      display:grid;
      grid-template-columns:
        repeat(3,minmax(0,1fr));
      gap:8px;
    }

    .mini-stat{
      background:#f8fafc;
      border-radius:12px;
      padding:10px 8px;
      text-align:center;
    }

    .mini-stat .k{
      font-size:11px;
      color:#6b7280;
      margin-bottom:4px;
    }

    .mini-stat .v{
      font-size:17px;
      font-weight:900;
    }

    /* 직원별 실적 표 */
    .emp-table-wrap{
      overflow-x:auto;
      -webkit-overflow-scrolling:touch;
    }

    .emp-table{
      width:100%;
      border-collapse:collapse;
      table-layout:fixed;
      font-size:13px;
      background:#fff;
    }

    .emp-table th,
    .emp-table td{
      padding:7px 2px;
      text-align:center;
      border-bottom:1px solid #eef0f3;
      white-space:nowrap;
    }

    .emp-table thead th{
      font-size:11px;
      font-weight:700;
      color:#6b7280;
      background:#f8fafc;
      border-bottom:1px solid #e5e7eb;
    }

    .emp-table td{
      font-weight:800;
      font-variant-numeric:tabular-nums;
    }

    .emp-table .emp-name{
      width:23%;
      text-align:left;
      padding-left:8px;
      font-weight:900;
      color:#111827;
      overflow:hidden;
      text-overflow:ellipsis;
      position:sticky;
      left:0;
      background:#fff;
    }

    .emp-table thead .emp-name{
      background:#f8fafc;
      color:#6b7280;
    }

    .emp-table td.zero{
      color:#c0c4cc;
      font-weight:600;
    }

    .emp-table tbody tr:last-child td{
      border-bottom:0;
    }

    .emp-table tfoot td{
      border-top:2px solid #d1d5db;
      border-bottom:0;
      background:#f8fafc;
      font-weight:900;
      color:#111827;
    }

    .emp-table tfoot .emp-name{
      background:#f8fafc;
    }

    @media (max-width:340px){
      .emp-table{font-size:12px}
      .emp-table thead th{font-size:10px;letter-spacing:-0.4px}
      .emp-table .emp-name{padding-left:5px}
    }

    .case-list{
      display:grid;
      gap:12px;
    }

    .case-card{
      background:#fff;
      border:1px solid #e5e7eb;
      border-radius:18px;
      padding:16px;
    }

    .case-head{
      display:block;
    }

    .case-name{
      font-size:17px;
      font-weight:900;
      margin-bottom:6px;
    }

    .case-sub{
      color:#6b7280;
      font-size:12px;
      line-height:1.65;
    }

    .case-review-row{
      margin-top:10px;
    }

    .review-badge{
      display:inline-flex;
      align-items:center;
      min-height:28px;
      padding:0 10px;
      border-radius:999px;
      background:#f3f4f6;
      color:#6b7280;
      font-size:12px;
      font-weight:800;
    }

    .review-badge.done{
      background:#dcfce7;
      color:#166534;
    }

    .case-memo{
      margin-top:10px;
      padding:10px 12px;
      border-radius:12px;
      background:#f8fafc;
      font-size:13px;
      line-height:1.5;
      word-break:break-word;
    }

    .case-memo.muted{
      color:#9ca3af;
    }

    .case-money-grid{
      display:grid;
      grid-template-columns:
        repeat(3,minmax(0,1fr));
      gap:8px;
      margin-top:14px;
    }

    .case-money-item{
      background:#f8fafc;
      border-radius:13px;
      padding:11px 8px;
      text-align:center;
      min-width:0;
    }

    .case-money-label{
      font-size:11px;
      color:#6b7280;
      margin-bottom:5px;
    }

    .case-money-value{
      font-size:15px;
      font-weight:900;
      overflow-wrap:anywhere;
    }

    .case-money-value.remaining{
      color:#166534;
    }

    .case-money-value.negative{
      color:#dc2626;
    }

    .form-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }

    .field{
      min-width:0;
    }

    .field.full{
      grid-column:1/-1;
    }

    .field label{
      display:block;
      font-size:12px;
      color:#4b5563;
      font-weight:800;
      margin:0 0 6px;
    }

    .field input,
    .field select,
    .field textarea{
      width:100%;
      border:1px solid #d1d5db;
      border-radius:12px;
      background:#fff;
      padding:10px 12px;
      outline:none;
    }

    .field input,
    .field select{
      height:44px;
    }

    .field textarea{
      min-height:92px;
      resize:vertical;
    }

    .primary-btn{
      width:100%;
      min-height:48px;
      border:0;
      border-radius:13px;
      background:#111827;
      color:#fff;
      font-weight:900;
      margin-top:12px;
    }

    .secondary-btn{
      width:100%;
      min-height:44px;
      border:1px solid #d1d5db;
      border-radius:13px;
      background:#fff;
      color:#111827;
      font-weight:800;
      margin-top:8px;
    }

    .spot-list{
      display:grid;
      gap:10px;
      margin-top:14px;
    }

    .spot-card{
      background:#fff;
      border:1px solid #e5e7eb;
      border-radius:16px;
      padding:14px;
    }

    .spot-name{
      font-weight:900;
      font-size:16px;
      margin-bottom:6px;
    }

    .spot-sub{
      font-size:12px;
      color:#6b7280;
      line-height:1.6;
    }

    .spot-result{
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:center;
      margin-top:10px;
      padding-top:10px;
      border-top:1px solid #f0f0f0;
    }

    .spot-total{
      font-weight:900;
      font-size:17px;
    }

    /* 스팟 대상건 / 스팟완료 */
    .spot-stats{
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:6px;
      margin-top:10px;
    }

    .spot-stat{
      background:#f8fafc;
      border-radius:10px;
      padding:7px 4px;
      text-align:center;
    }

    .spot-stat .k{
      font-size:11px;
      color:#6b7280;
    }

    .spot-stat .v{
      font-size:14px;
      font-weight:900;
      margin-top:2px;
      white-space:nowrap;
    }

    .spot-stat.done .v{color:#047857}
    .spot-stat.pending .v{color:#b45309}

    .spot-memo{
      margin-top:10px;
      padding:10px 12px;
      border-radius:12px;
      background:#f8fafc;
      min-width:0;
    }

    .spot-memo + .spot-memo{
      margin-top:6px;
    }

    .spot-memo .k{
      font-size:12px;
      font-weight:800;
      color:#6b7280;
      margin-bottom:4px;
    }

    .spot-text{
      font-size:14px;
      line-height:1.55;
      color:#111827;
      white-space:pre-wrap;
      overflow-wrap:anywhere;
      word-break:break-word;
    }

    .spot-text.clamp{
      display:-webkit-box;
      -webkit-box-orient:vertical;
      -webkit-line-clamp:4;
      overflow:hidden;
    }

    .spot-more{
      margin-top:4px;
      padding:6px 0;
      min-height:32px;
      border:0;
      background:transparent;
      color:#2563eb;
      font-size:13px;
      font-weight:800;
    }

    .spot-targets{
      margin-top:10px;
      border-top:1px solid #f0f0f0;
      padding-top:6px;
    }

    .spot-targets summary{
      font-size:12px;
      font-weight:800;
      color:#374151;
      padding:4px 0;
      cursor:pointer;
    }

    .spot-target{
      display:grid;
      grid-template-columns:22px 38px minmax(0,1fr) 98px 46px;
      align-items:center;
      gap:4px;
      font-size:12.5px;
      padding:7px 0;
      border-bottom:1px solid #f3f4f6;
    }

    .spot-target:last-child{
      border-bottom:0;
    }

    .spot-target input{
      width:18px;
      height:18px;
      margin:0;
    }

    .spot-target .t-date{
      color:#6b7280;
      font-variant-numeric:tabular-nums;
    }

    .spot-target .t-name{
      font-weight:800;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .spot-target .t-ctn{
      font-variant-numeric:tabular-nums;
      white-space:nowrap;
    }

    .spot-target .t-staff{
      color:#374151;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      text-align:right;
    }

    .spot-target.done .t-name,
    .spot-target.done .t-ctn{
      color:#047857;
    }

    .spot-target-head{
      font-size:11px;
      color:#9ca3af;
      font-weight:700;
      padding:4px 0;
    }

    .spot-target-head span:last-child{
      text-align:right;
    }

    .spot-empty{
      font-size:12px;
      color:#9ca3af;
      padding:6px 0;
    }

    @media (max-width:340px){
      .spot-target{
        grid-template-columns:20px 34px minmax(0,1fr) 88px 42px;
        font-size:11.5px;
        gap:3px;
      }
      .spot-stat .v{font-size:12.5px}
    }

    .preview{
      margin-top:12px;
      padding:14px;
      border-radius:14px;
      background:#111827;
      color:#fff;
      white-space:pre-wrap;
      word-break:break-word;
      font-size:13px;
      line-height:1.7;
    }

    .mg-chips{
      display:flex;
      flex-wrap:wrap;
      gap:6px;
      margin-top:6px;
    }

    .mg-chip{
      border:1px solid #d1d5db;
      background:#fff;
      border-radius:999px;
      padding:8px 12px;
      min-height:38px;
      font-size:14px;
      font-weight:800;
      color:#111827;
      max-width:100%;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .mg-chip.on{
      background:#111827;
      border-color:#111827;
      color:#fff;
    }

    .mg-toggles{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
    }

    .mg-toggle{
      display:flex;
      align-items:center;
      gap:10px;
      min-height:52px;
      padding:0 14px;
      border:1px solid #d1d5db;
      border-radius:13px;
      background:#fff;
      font-size:16px;
      font-weight:900;
      cursor:pointer;
    }

    .mg-toggle input{
      width:24px;
      height:24px;
      margin:0;
      flex:0 0 auto;
    }

    @media (max-width:360px){
      .mg-toggle{
        padding:0 10px;
        gap:8px;
        font-size:15px;
        white-space:nowrap;
      }
    }

    .mg-toggle.on{
      border-color:#111827;
      background:#f3f4f6;
    }

    .mg-amount{
      margin-top:6px;
      font-size:15px;
      font-weight:900;
      color:#111827;
    }

    .mg-amount.err{
      color:#b91c1c;
    }

    .mg-fixed{
      font-size:14px;
      font-weight:800;
      color:#4b5563;
      margin-bottom:10px;
    }

    #page-manager .field input{
      height:48px;
      font-size:16px;
    }

    .activation-text{
      width:100%;
      min-height:310px;
      border:1px solid #d1d5db;
      border-radius:14px;
      padding:14px;
      resize:vertical;
      outline:none;
      line-height:1.6;
    }

    .risk-filter{
      display:flex;
      gap:7px;
      flex-wrap:wrap;
      margin-bottom:12px;
    }

    .risk-status-btn{
      border:1px solid #d1d5db;
      border-radius:999px;
      background:#fff;
      padding:8px 12px;
      font-size:12px;
      font-weight:800;
    }

    .risk-status-btn.active{
      background:#111827;
      color:#fff;
      border-color:#111827;
    }

    .risk-list{
      display:grid;
      gap:12px;
    }

    .risk-card{
      background:#fff;
      border:1px solid #e5e7eb;
      border-radius:17px;
      padding:15px;
    }

    .risk-title{
      font-weight:900;
      font-size:16px;
      margin-bottom:5px;
    }

    .risk-sub{
      font-size:12px;
      color:#6b7280;
      line-height:1.5;
      margin-bottom:12px;
    }

    .risk-check{
      display:flex;
      align-items:center;
      gap:8px;
      margin-top:10px;
      font-weight:800;
      font-size:13px;
    }

    .risk-check input{
      width:20px;
      height:20px;
    }

    .empty{
      background:#fff;
      border:1px dashed #d1d5db;
      border-radius:15px;
      padding:24px 14px;
      text-align:center;
      color:#9ca3af;
      font-size:13px;
    }

    .warning{
      margin-bottom:12px;
      padding:12px;
      border-radius:12px;
      background:#fff7ed;
      color:#9a3412;
      font-size:12px;
      line-height:1.5;
    }

    .bottom-nav{
      position:fixed;
      z-index:100;
      left:50%;
      bottom:0;
      transform:translateX(-50%);
      width:100%;
      max-width:760px;
      height:72px;
      display:grid;
      grid-template-columns:
        repeat(6,minmax(0,1fr));
      background:#fff;
      border-top:1px solid #e5e7eb;
      padding-bottom:
        env(safe-area-inset-bottom);
    }

    .nav-btn{
      border:0;
      background:transparent;
      color:#9ca3af;
      font-size:11px;
      font-weight:800;
      padding:8px 2px 6px;
      min-width:0;
      line-height:1.15;
      word-break:keep-all;
    }

    @media (max-width:340px){
      .nav-btn{
        font-size:10px;
        letter-spacing:-0.4px;
        padding-left:0;
        padding-right:0;
      }
    }

    .nav-icon{
      display:block;
      font-size:21px;
      line-height:1;
      margin-bottom:5px;
    }

    .nav-btn.active{
      color:#111827;
    }

    .loading{
      display:none;
      position:fixed;
      inset:0;
      z-index:999;
      background:rgba(255,255,255,.72);
      align-items:center;
      justify-content:center;
      font-weight:900;
      font-size:15px;
    }

    .loading.show{
      display:flex;
    }

    .toast{
      position:fixed;
      left:50%;
      bottom:88px;
      transform:translateX(-50%);
      z-index:1000;
      background:#111827;
      color:#fff;
      border-radius:999px;
      padding:11px 16px;
      font-size:13px;
      font-weight:800;
      opacity:0;
      pointer-events:none;
      transition:.2s;
      max-width:calc(100% - 32px);
      text-align:center;
    }

    .toast.show{
      opacity:1;
    }

    @media(max-width:420px){
      .summary-grid{
        grid-template-columns:1fr 1fr;
      }

      .form-grid{
        grid-template-columns:1fr;
      }

      .field.full{
        grid-column:auto;
      }

      .case-money-grid{
        gap:5px;
      }

      .case-money-item{
        padding:10px 4px;
      }

      .case-money-value{
        font-size:13px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header class="topbar">

    <div class="top-title">
      관저중로점 무선 실적
    </div>

    <div class="top-row">

      <select
        id="globalMonth"
        onchange="changeMonth()"
      ></select>

      <button
        class="refresh-btn"
        onclick="refreshData()"
      >
        새로고침
      </button>

    </div>

  </header>

  <!-- 홈 -->
  <section
    id="page-home"
    class="page active"
  >

    <h2 class="section-title">
      홈
    </h2>

    <div id="warningBox"></div>

    <div class="panel">

      <div class="section-title">
        예산
      </div>

      <div id="homeSummary"></div>

    </div>

    <div class="panel">

      <div class="section-title">
        직원별 실적
      </div>

      <div
        id="employeeList"
        class="employee-list"
      ></div>

    </div>

  </section>

  <!-- 예산관리 -->
  <section
    id="page-budget"
    class="page"
  >

    <h2 class="section-title">
      예산관리
    </h2>

    <div class="section-sub">
      금액·검수·메모는 장표에서 직접 관리합니다.
    </div>

    <div class="filter-row">

      <select
        id="filterStaff"
        onchange="renderCases()"
      >
        <option value="">
          전체 직원
        </option>
      </select>

    </div>

    <div
      id="caseList"
      class="case-list"
    ></div>

  </section>

  <!-- 스팟 -->
  <section
    id="page-spot"
    class="page"
  >

    <h2 class="section-title">
      스팟
    </h2>

    <div class="panel">

      <div class="form-grid">

        <input
          type="hidden"
          id="spotId"
        >

        <div class="field full">
          <label>스팟명</label>

<script>

let DATA={
  cases:[],
  spots:[],
  risks:[],
  employeeStats:[],
  months:[],
  summary:{}
};

let SELECTED_MONTH='';
let CURRENT_PAGE='home';
let RISK_STATUS_FILTER='all';
let AUTO_REFRESH_TIMER=null;


/* =========================
   공통
========================= */

function esc(v){

  return String(
    v==null?'':v
  )
  .replace(/&/g,'&amp;')
  .replace(/</g,'&lt;')
  .replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;')
  .replace(/'/g,'&#039;');
}


function money(v){

  const n=
    Number(v)||0;

  return(
    n.toLocaleString('ko-KR')+
    '원'
  );
}


function numeric(v){

  return Number(
    String(
      v==null?'':v
    )
    .replace(
      /[^0-9.-]/g,
      ''
    )
  )||0;
}


function showLoading(v){

  document
    .getElementById('loading')
    .classList
    .toggle(
      'show',
      !!v
    );
}


function toast(msg){

  const el=
    document.getElementById('toast');

  el.textContent=
    msg||'';

  el.classList.add('show');

  clearTimeout(
    el._timer
  );

  el._timer=
    setTimeout(
      ()=>{
        el.classList.remove('show');
      },
      2200
    );
}


function fail(err){

  showLoading(false);

  const msg=
    err&&err.message
      ?err.message
      :String(
        err||
        '오류가 발생했습니다.'
      );

  toast(msg);
}


function openPage(
  page,
  btn
){

  CURRENT_PAGE=
    page;

  document
    .querySelectorAll('.page')
    .forEach(
      el=>
        el.classList.remove('active')
    );

  const target=
    document.getElementById(
      'page-'+page
    );

  if(target){
    target.classList.add('active');
  }

  document
    .querySelectorAll('.nav-btn')
    .forEach(
      el=>
        el.classList.remove('active')
    );

  if(btn){
    btn.classList.add('active');
  }

  window.scrollTo(0,0);
}


/* =========================
   데이터
========================= */

function loadData(
  month,
  silent=false
){

  if(!silent){
    showLoading(true);
  }

  google.script.run
    .withSuccessHandler(
      d=>{

        showLoading(false);

        DATA=
          d||{
            cases:[],
            spots:[],
            risks:[],
            employeeStats:[],
            months:[],
            summary:{}
          };

        SELECTED_MONTH=
          DATA.selectedMonth||
          month||
          '';

        renderAll();
      }
    )
    .withFailureHandler(fail)
    .getDashboardData(
      month||''
    );
}


function refreshData(){

  loadData(
    SELECTED_MONTH
  );
}


function changeMonth(){

  const v=
    document
      .getElementById('globalMonth')
      .value;

  loadData(v);
}


function renderAll(){

  renderMonthSelect();
  renderStaffFilters();
  renderWarnings();
  renderHome();
  renderEmployees();
  renderCases();
  renderSpots();
  renderRisk();
  renderManagerForm();
}


function renderMonthSelect(){

  const el=
    document.getElementById('globalMonth');

  const months=
    DATA.months||[];

  el.innerHTML=
    months
      .map(
        m=>`
          <option
            value="${esc(m.key)}"
            ${
              m.key===SELECTED_MONTH
                ?'selected'
                :''
            }
          >
            ${esc(m.title)}
          </option>
        `
      )
      .join('');
}


function renderStaffFilters(){

  const staff=
    [
      ...new Set(
        (DATA.cases||[])
          .map(x=>x.staff)
          .filter(Boolean)
      )
    ]
    .sort(
      (a,b)=>
        a.localeCompare(
          b,
          'ko'
        )
    );

  const budget=
    document.getElementById(
      'filterStaff'
    );

  const risk=
    document.getElementById(
      'riskStaffFilter'
    );

  const oldBudget=
    budget.value;

  const oldRisk=
    risk.value;

  const options=
    staff
      .map(
        s=>`
          <option value="${esc(s)}">
            ${esc(s)}
          </option>
        `
      )
      .join('');

  budget.innerHTML=
    '<option value="">전체 직원</option>'+
    options;

  risk.innerHTML=
    '<option value="">전체 직원</option>'+
    options;

  if(
    staff.includes(oldBudget)
  ){
    budget.value=
      oldBudget;
  }

  if(
    staff.includes(oldRisk)
  ){
    risk.value=
      oldRisk;
  }
}


function renderWarnings(){

  const el=
    document.getElementById(
      'warningBox'
    );

  const list=
    DATA.warnings||[];

  if(!list.length){
    el.innerHTML='';
    return;
  }

  el.innerHTML=
    list
      .map(
        x=>`
          <div class="warning">
            ${esc(x)}
          </div>
        `
      )
      .join('');
}


/* =========================
   홈
========================= */

function renderHome(){

  const s=
    DATA.summary||{};

  /*
   * 장표 기반 확보액
   * 고객혜택 = '고객혜택' 헤더 열 합계
   * 기타 = 총 확보금액 합계 - 고객혜택 (중복 없음)
   */
  const benefitSecured=
    Number(
      s.customerBenefitTotal||0
    );

  const otherSecured=
    Number(
      s.otherSecuredTotal||0
    );

  /*
   * 스팟 확보금액
   * = 스팟 달성금액 합계 (웹앱 계산)
   */
  const spotSecured=
    Number(
      s.spotEarned||0
    );

  /*
   * 총 사용금액
   */
  const used=
    Number(
      s.usedTotal||0
    );

  /*
   * 잔여금액
   * = 고객혜택 + 기타 + 스팟 - 사용금액
   */
  const totalRemaining=
    benefitSecured+
    otherSecured+
    spotSecured-
    used;

  const row=(label,value,cls)=>`
    <div class="budget-row ${cls||''}">
      <div class="label">${label}</div>
      <div class="value">${money(value)}</div>
    </div>
  `;

  document
    .getElementById('homeSummary')
    .innerHTML=
      row('고객혜택 확보액',benefitSecured)+
      row('기타 확보액',otherSecured)+
      row('스팟 확보액',spotSecured)+
      '<div class="budget-sep"></div>'+
      row('사용금액',used)+
      row('잔여금액',totalRemaining,'total');
}


function renderEmployees(){

  const el=
    document.getElementById(
      'employeeList'
    );

  const rows=
    DATA.employeeStats||[];

  if(!rows.length){

    el.innerHTML=
      '<div class="empty">해당 월 실적이 없습니다.</div>';

    return;
  }

  const cell=
    v=>{

      const n=
        Number(v||0);

      return`<td class="${n?'':'zero'}">${n}</td>`;
    };

  el.innerHTML=`
    <div class="emp-table-wrap">
      <table class="emp-table">
        <thead>
          <tr>
            <th class="emp-name">직원명</th>
            <th>개통</th>
            <th>MNP</th>
            <th>스초</th>
            <th>가구초</th>
            <th>세컨</th>
            <th>카드</th>
          </tr>
        </thead>
        <tbody>
          ${
            rows
              .map(
                r=>`
                  <tr>
                    <td class="emp-name">${esc(r.staff)}</td>
                    ${cell(r.post)}
                    ${cell(r.mnp)}
                    ${cell(r.choice)}
                    ${cell(r.house)}
                    ${cell(r.second)}
                    ${cell(r.card)}
                  </tr>
                `
              )
              .join('')
          }
        </tbody>
        <tfoot>
          <tr>
            <td class="emp-name">총합</td>
            ${
              ['post','mnp','choice','house','second','card']
                .map(
                  k=>`<td>${
                    rows.reduce(
                      (sum,r)=>sum+(Number(r[k])||0),
                      0
                    )
                  }</td>`
                )
                .join('')
            }
          </tr>
        </tfoot>
      </table>
    </div>
  `;
}


function miniStat(k,v){

  return`
    <div class="mini-stat">

      <div class="k">
        ${k}
      </div>

      <div class="v">
        ${Number(v||0)}
      </div>

    </div>
  `;
}


/* =========================
   예산관리
========================= */

function renderCases(){

  const staff=
    document
      .getElementById('filterStaff')
      .value;

  const list=
    (DATA.cases||[])
      .filter(
        c=>
          !staff||
          c.staff===staff
      );

  const el=
    document.getElementById(
      'caseList'
    );

  if(!list.length){

    el.innerHTML=
      '<div class="empty">해당 조건의 개통건이 없습니다.</div>';

    return;
  }

  el.innerHTML=
    list
      .map(
        c=>{

          const secured=
            Number(
              c.secured||0
            );

          const used=
            Number(
              c.used!=null
                ?c.used
                :c.totalUsed||0
            );

          const remaining=
            Number(
              c.remaining!=null
                ?c.remaining
                :secured-used
            );

          const review=
            c.reviewed
              ?`
                <span class="review-badge done">
                  ✓ 검수완료
                </span>
              `
              :`
                <span class="review-badge">
                  검수대기
                </span>
              `;

          const memo=
            c.memo
              ?`
                <div class="case-memo">
                  <strong>메모</strong>
                  ·
                  ${esc(c.memo)}
                </div>
              `
              :`
                <div class="case-memo muted">
                  메모 없음
                </div>
              `;

          return`
            <div class="case-card">

              <div class="case-head">

                <div class="case-name">

                  ${esc(c.name)}

                  ${
                    c.no
                      ?` · ${esc(c.no)}번`
                      :''
                  }

                </div>

                <div class="case-sub">

                  ${esc(c.date||'-')}
                  ·
                  ${esc(c.staff||'-')}
                  ·
                  ${esc(c.phone||'-')}

                  <br>

                  ${esc(c.model||'-')}
                  ·
                  ${esc(c.type||'-')}
                  ·
                  ${esc(c.plan||'-')}

                </div>

                <div class="case-review-row">
                  ${review}
                </div>

                ${memo}

                <div class="case-money-grid">

                  <div class="case-money-item">

                    <div class="case-money-label">
                      확보금액
                    </div>

                    <div class="case-money-value">
                      ${money(secured)}
                    </div>

                  </div>

                  <div class="case-money-item">

                    <div class="case-money-label">
                      사용금액
                    </div>

                    <div class="case-money-value">
                      ${money(used)}
                    </div>

                  </div>

                  <div class="case-money-item">

                    <div class="case-money-label">
                      잔여금액
                    </div>

                    <div class="
                      case-money-value
                      remaining
                      ${
                        remaining<0
                          ?'negative'
                          :''
                      }
                    ">
                      ${money(remaining)}
                    </div>

                  </div>

                </div>

              </div>

            </div>
          `;
        }
      )
      .join('');
}

  document.getElementById('spotT3').value='';
  document.getElementById('spotV3').value='';

}


function renderSpots(){

  const el=
    document.getElementById(
      'spotList'
    );

  const list=
    DATA.spots||[];

  if(!list.length){

    el.innerHTML=
      '<div class="empty">등록된 스팟이 없습니다.</div>';

    return;
  }

  el.innerHTML=
    list
      .map(

/*
 * 스팟 카드: 달성조건 → 비고 (실적 요약 바로 아래)
 * 달성조건 = 스팟 관리에 등록된 계산방식 + 1~3차 목표/금액 (저장 데이터 그대로, 화면 표시만)
 * 비고 = 등록 원문 그대로 (줄바꿈 유지), 빈 항목은 숨김
 * 긴 내용은 4줄까지 보이고 펼쳐보기 (펼친 상태는 새로고침 후에도 유지)
 */
const SPOT_MEMO_OPEN=new Set();

function spotMetricLabel(m){
  const o=document.querySelector(`#spotMetric option[value="${CSS.escape(String(m||''))}"]`);
  return o?o.textContent.trim():String(m||'');
}

function spotConditionText(s){
  const tiers=(s.tiers||[]).slice().sort((a,b)=>a.target-b.target);
  if(!tiers.length) return '';
  const perCase=s.mode==='구간건당';
  return[
    `${s.mode||''} · ${spotMetricLabel(s.metric)} 완료 건수 기준`,
    ...tiers.map(t=>`${t.no}차: ${Number(t.target)}건 이상 → ${perCase?'건당 ':''}${money(t.value)}`)
  ].join('\n');
}

function renderSpotMemo(s,field,label,text){
  const t=String(text==null?'':text).replace(/\r\n?/g,'\n');
  if(!t.trim()) return '';
  const key=String(s.id)+'|'+field;
  const long=t.split('\n').length>4||t.length>120;
  const open=SPOT_MEMO_OPEN.has(key);
  return`
    <div class="spot-memo" data-memo="${esc(field)}">
      <div class="k">${esc(label)}</div>
      <div class="spot-text ${long&&!open?'clamp':''}">${esc(t)}</div>
      ${long?`<button type="button" class="spot-more" data-key="${esc(key)}" onclick="toggleSpotMemo(this)">${open?'접기':'펼쳐보기'}</button>`:''}
    </div>
  `;
}

function toggleSpotMemo(btn){
  const key=btn.dataset.key;
  const text=btn.parentElement.querySelector('.spot-text');
  const open=!SPOT_MEMO_OPEN.has(key);
  if(open) SPOT_MEMO_OPEN.add(key); else SPOT_MEMO_OPEN.delete(key);
  text.classList.toggle('clamp',!open);
  btn.textContent=open?'접기':'펼쳐보기';
}

function spotDateLabel(d){

  const m=
    String(d||'')
      .match(/^\d{4}-(\d{2})-(\d{2})$/);

  return m
    ?m[1]+'/'+m[2]
    :String(d||'-');
}


function ctnLabel(v){

  const d=
    String(v||'')
      .replace(/\D/g,'');

  if(d.length===11){
    return d.slice(0,3)+'-'+d.slice(3,7)+'-'+d.slice(7);
  }

  if(d.length===10){
    return d.slice(0,3)+'-'+d.slice(3,6)+'-'+d.slice(6);
  }

  return String(v||'');
}


function renderSpotTargets(s){

  const targets=
    s.targets||[];

  if(!targets.length){

    return`
      <div class="spot-targets">
        <div class="spot-empty">
          기간·조건에 해당하는 개통건이 없습니다.
        </div>
      </div>
    `;
  }

  return`
    <details class="spot-targets" open>

      <summary>
        대상 개통건 ${targets.length}건
      </summary>

      <div class="spot-target spot-target-head">
        <span>완료</span>
        <span>날짜</span>
        <span>고객명</span>
        <span>CTN</span>
        <span>개통자</span>
      </div>

      ${
        targets
          .map(
            t=>`
              <label class="spot-target ${t.done?'done':''}">
                <input
                  type="checkbox"
                  ${t.done?'checked':''}
                  data-spot="${esc(s.id)}"
                  data-month="${esc(t.month)}"
                  data-phone="${esc(t.phone)}"
                  onchange="toggleSpotDone(this)"
                >
                <span class="t-date">${esc(spotDateLabel(t.date))}</span>
                <span class="t-name">${esc(t.name)}</span>
                <span class="t-ctn">${esc(ctnLabel(t.phone))}</span>
                <span class="t-staff">${esc(t.staff)}</span>
              </label>
            `
          )
          .join('')
      }

    </details>
  `;
}

const MG_CARD_CHIPS=['신한','신한할부','우리할부','국민할부'];
let MG_READY=false;

function mgTop(field,n,fallback){
  const cnt={};
  (DATA.cases||[]).forEach(c=>{
    const v=String(c[field]||'').trim();
    if(v) cnt[v]=(cnt[v]||0)+1;
  });
  const out=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]||a.localeCompare(b,'ko'));
  (fallback||[]).forEach(v=>{ if(out.indexOf(v)<0) out.push(v); });
  return out.slice(0,n);
}

function mgChips(id,values){
  const box=document.getElementById(id+'Chips');
  box.innerHTML=values.map(v=>
    `<button type="button" class="mg-chip" data-v="${esc(v)}" onclick="mgPick('${id}',this)">${esc(v)}</button>`
  ).join('');
  mgSyncChips(id);
}

function mgPick(id,btn){
  document.getElementById(id).value=btn.dataset.v;
  mgSyncChips(id);
  mgDirty();
}

function mgSyncChips(id){
  const v=document.getElementById(id).value.trim();
  document.querySelectorAll('#'+id+'Chips .mg-chip')
    .forEach(b=>b.classList.toggle('on',b.dataset.v===v));
}

function renderManagerForm(){
  const d=document.getElementById('mgDate');
  if(!d.value) d.value=new Date(Date.now()+9*3600e3).toISOString().slice(0,10);
  mgChips('mgType',mgTop('type',5,['기변','MNP','신규']));
  mgChips('mgModel',mgTop('model',6));
  mgChips('mgPlan',mgTop('plan',6));
  mgChips('mgCard',MG_CARD_CHIPS);

    mgTop('model',60).map(v=>`<option value="${esc(v)}">`).join('');
  document.getElementById('mgPlanList').innerHTML=
    mgTop('plan',60).map(v=>`<option value="${esc(v)}">`).join('');
  mgToggle();
  mgAmount();
}

function mgToggle(){
  [['mgCardOn','mgCardBox'],['mgIns','mgInsBox'],['mgAddon','mgAddBox'],['mgWired','mgWiredBox']]
    .forEach(([i,b])=>document.getElementById(b).classList.toggle('on',document.getElementById(i).checked));
  document.getElementById('mgCardField').hidden=!document.getElementById('mgCardOn').checked;

}

function mgAmount(){
  const el=document.getElementById('mgDeviceAmount');
  try{

function mgDirty(){

  const pv=document.getElementById('mgPreview');
  if(pv) pv.innerHTML='';

function displayMonthLabel(mk){
  const m=String(mk||'').match(/^(\d{4})-(\d{2})$/);

function saveManager(){
  if(!MG_READY){

  }
  const f=mgForm();

  google.script.run
    .withSuccessHandler(r=>{
      const mk=r&&r.data&&r.data.month?r.data.month:SELECTED_MONTH;

        .forEach(id=>{ document.getElementById(id).value=''; });

          :'장표 반영 완료 ('+r.sheet+' '+r.row+'행)'
      );
      loadData(mk);
    })
    .withFailureHandler(e=>{ btn.disabled=false; fail(e); })
    .saveManagerActivation(f);
}

function setRiskStatus(
  status,
  btn
){

  RISK_STATUS_FILTER=
    status||
    'all';

  document
    .querySelectorAll(
      '.risk-status-btn'
    )
    .forEach(
      x=>
        x.classList.remove('active')
    );

  if(btn){
    btn.classList.add('active');
  }

  renderRisk();
}


function getStaffFilteredRisk(){

  const staff=
    document
      .getElementById('riskStaffFilter')
      .value;

  return(
    DATA.risks||[]
  ).filter(
    r=>
      !staff||
      r.staff===staff
  );
}


function getFilteredRisk(){

  return getStaffFilteredRisk()
    .filter(
      r=>{

        if(
          RISK_STATUS_FILTER===
          'complete'
        ){
          return !!r.completed;
        }

        if(
          RISK_STATUS_FILTER===
          'incomplete'
        ){
          return !r.completed;
        }

        return true;
      }
    );
}


function renderRisk(){

  const baseList=
    getStaffFilteredRisk();

  const list=
    getFilteredRisk();

  const completed=
    baseList.filter(
      r=>r.completed
    ).length;

  const incomplete=
    baseList.length-
    completed;

  const summary=[
    [
      '총 카드유치건수',
      baseList.length+'건'
    ],
    [
      '완료카드건수',
      completed+'건'
    ],
    [
      '미완료건수',
      incomplete+'건'
    ]
  ];

  document
    .getElementById('riskSummary')
    .innerHTML=
      summary
        .map(
          x=>`
            <div class="summary">

              <div class="label">
                ${x[0]}
              </div>

              <div class="value">
                ${x[1]}
              </div>

            </div>
          `
        )
        .join('');

  const el=
    document.getElementById(
      'riskList'
    );

  if(!list.length){

    el.innerHTML=
      '<div class="empty">해당 조건의 카드건이 없습니다.</div>';

    return;
  }

  el.innerHTML=
    list
      .map(
        (r,i)=>{

          const k=
            'r'+i;

          return`
            <div class="risk-card">

              <div class="risk-title">

                ${esc(r.name)}

                ${
                  r.no
                    ?` · ${esc(r.no)}번`
                    :''
                }

              </div>

              <div class="risk-sub">

                ${esc(r.date||'-')}
                ·
                ${esc(r.staff||'-')}

                <br>

                ${esc(r.phone||'-')}

              </div>

              <div class="form-grid">

                <div class="field">

                  <label>
                    카드1
                  </label>

                  <input
                    id="risk-card1-${k}"
                    value="${esc(r.card1||'')}"
                    placeholder="예: 신한"
                  >

                </div>

                <div class="field">

                  <label>
                    카드2
                  </label>

                  <input
                    id="risk-card2-${k}"
                    value="${esc(r.card2||'')}"
                    placeholder="예: 국민할부"
                  >

                </div>

                <div class="field full">

                  <label>
                    메모
                  </label>

                  <textarea
                    id="risk-memo-${k}"
                  >${esc(r.memo||'')}</textarea>

                </div>

              </div>

              <label class="risk-check">

                <input
                  id="risk-done-${k}"
                  type="checkbox"
                  ${r.completed?'checked':''}
                >

                카드 처리 완료

              </label>

              <button
                id="risk-save-${k}"
                class="primary-btn"
                onclick="saveRiskRow(${i},'${k}')"
              >
                저장
              </button>

            </div>

}

    month:r.month,
    phone:r.phone,
    name:r.name,
    date:r.date,
    staff:r.staff,

    card1:
      card1El
        ?card1El.value.trim()
        :'',

    card2:
      card2El
        ?card2El.value.trim()
        :'',

    completed:
      doneEl
        ?doneEl.checked
        :false,

    memo:
      memoEl
        ?memoEl.value.trim()
        :''
  };

  if(saveBtn){

    saveBtn.disabled=true;

    saveBtn.textContent=
      '저장 중...';
  }

  google.script.run
    .withSuccessHandler(
      ()=>{

        r.card1=p.card1;
        r.card2=p.card2;
        r.completed=p.completed;
        r.memo=p.memo;

        renderRisk();

        toast(
          '리스크 저장 완료'
        );
      }
    )
    .withFailureHandler(
      err=>{

        if(saveBtn){

          saveBtn.disabled=false;

          saveBtn.textContent='저장';
        }

        fail(err);
      }
    )
    .saveRisk(p);
}


/* =========================
   미완료 카드 공지
========================= */

function getSelectedMonthLabel(){

  const month=
    String(
      SELECTED_MONTH||''
    );

  const match=
    month.match(
      /^(\d{4})-(\d{1,2})$/
    );

  if(match){

    return(
      Number(match[2])+
      '월'
    );
  }

  return '선택월';
}


function riskNoNumber(r){

  const n=
    Number(
      String(
        r.no==null
          ?''
          :r.no
      ).replace(
        /[^0-9.-]/g,
        ''
      )
    );

  return Number.isFinite(n)
    ?n
    :999999;
}


function getIncompleteRiskForNotice(){

  const staff=
    document
      .getElementById('riskStaffFilter')
      .value;

  return(
    DATA.risks||[]
  )
  .filter(
    r=>!r.completed
  )
  .filter(
    r=>
      !staff||
      r.staff===staff
  );
}


function buildIncompleteRiskNotice(){

  const list=
    getIncompleteRiskForNotice();

  const monthLabel=
    getSelectedMonthLabel();

  if(!list.length){

    return{
      text:'',
      count:0
    };
  }

  const groups={};

  list.forEach(
    r=>{

      const staff=
        r.staff||
        '미지정';

      if(!groups[staff]){
        groups[staff]=[];
      }

      groups[staff].push(r);
    }
  );

  const lines=[
    `[${monthLabel} 카드 미완료 안내]`,
    ''
  ];

  Object.keys(groups)
    .sort(
      (a,b)=>
        a.localeCompare(
          b,
          'ko'
        )
    )
    .forEach(
      staff=>{

        lines.push(
          `■ ${staff}`
        );

        groups[staff]
          .sort(
            (a,b)=>
              riskNoNumber(a)-
              riskNoNumber(b)
          )
          .forEach(
            r=>{

              const no=
                r.no
                  ?`${r.no}번`
                  :'';

              const cards=
                [
                  r.card1,
                  r.card2
                ]
                .filter(Boolean)
                .join(' / ');

              let line=
                `- ${no} ${r.name}`;

              if(cards){
                line+=
                  ` · ${cards}`;
              }

              lines.push(
                line.trim()
              );
            }
          );

        lines.push('');
      }
    );

  return{
    text:
      lines.join('\n').trim(),

    count:
      list.length
  };
}


async function copyIncompleteRiskNotice(){

  const result=
    buildIncompleteRiskNotice();

  if(!result.count){

    toast(
      '미완료 카드건이 없습니다.'
    );

    return;
  }

  try{

    await navigator.clipboard.writeText(
      result.text
    );

    toast(
      result.count+
      '건 공지 복사 완료'
    );

  }catch(e){

    const ta=
      document.createElement(
        'textarea'
      );

    ta.value=
      result.text;

    document.body.appendChild(ta);

    ta.select();

    document.execCommand('copy');

    ta.remove();

    toast(
      result.count+
      '건 공지 복사 완료'
    );
  }
}


/* =========================
   자동 새로고침
========================= */

function startAutoRefresh(){

  if(AUTO_REFRESH_TIMER){

    clearInterval(
      AUTO_REFRESH_TIMER
    );
  }

  AUTO_REFRESH_TIMER=
    setInterval(
      ()=>{

        if(
          CURRENT_PAGE===
          'activation'
        ){
          return;
        }

        if(
          CURRENT_PAGE===
          'risk'
        ){
          return;
        }

        loadData(
          SELECTED_MONTH,
          true
        );

      },
      30000
    );
}


/* =========================
   최초 실행
========================= */

window.addEventListener(
  'load',
  ()=>{

    loadData('');

    startAutoRefresh();
  }
);

</script>
