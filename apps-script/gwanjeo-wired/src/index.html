<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="UTF-8">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#f3f4f6;color:#111827;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  -webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
.app{max-width:620px;margin:0 auto;min-height:100vh;padding-bottom:40px}

/* 상단 */
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #e5e7eb;padding:14px 16px 0}
.title{font-size:19px;font-weight:900;letter-spacing:-.3px}
.month{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;margin:10px 0 12px}
.month button{height:40px;border:1px solid #e5e7eb;background:#fff;border-radius:12px;font-size:16px;font-weight:900}
.month .label{text-align:center;font-size:17px;font-weight:900}
.tabs{display:grid;grid-template-columns:repeat(3,1fr)}
.tab{border:0;background:none;padding:11px 2px 12px;font-size:14px;font-weight:700;color:#9ca3af;border-bottom:3px solid transparent}
.tab.active{color:#111827;border-bottom-color:#111827}

.page{display:none;padding:14px 16px}
.page.active{display:block}

/* 개통리스트 */
.search{width:100%;height:44px;border:1px solid #d1d5db;border-radius:12px;background:#fff;padding:0 14px;font-size:15px}
.count{font-size:13px;color:#6b7280;margin:12px 2px 8px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:14px;margin-bottom:10px}
.card .name{font-size:17px;font-weight:900}
.card .acc{font-size:14px;color:#374151;margin-top:2px;font-variant-numeric:tabular-nums}
.card .k{font-size:11px;color:#9ca3af;font-weight:700;margin-top:10px}
.card .v{font-size:14px;line-height:1.5;word-break:break-word;margin-top:2px}
.card .meta{font-size:11px;color:#9ca3af;margin-top:10px}
.empty{text-align:center;color:#9ca3af;font-size:14px;padding:40px 0}
.legacy{margin-top:18px;font-size:13px;color:#4b5563}
.legacy summary{font-weight:800;color:#6b7280;padding:6px 0;cursor:pointer}
.lg{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:10px 12px;margin-top:8px;line-height:1.7;word-break:break-word}
.lg b{color:#111827}
.lg .bad{color:#b45309}

/* 폼 */
.form{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:16px}
.form h2{margin:0 0 14px;font-size:17px;font-weight:900}
.field{margin-bottom:14px}
.field>label,.field>.lbl{display:block;font-size:13px;font-weight:800;color:#374151;margin-bottom:6px}
.req{color:#dc2626}
.input,select.input,textarea.input{width:100%;height:44px;border:1px solid #d1d5db;border-radius:12px;background:#fff;padding:0 12px;font-size:15px}
textarea.input{height:70px;padding:10px 12px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid #d1d5db;background:#fff;border-radius:999px;padding:9px 14px;font-size:14px;font-weight:700}
.chip.on{background:#111827;border-color:#111827;color:#fff}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg .chip{border-radius:12px;padding:11px 0;text-align:center}
.stepper{display:grid;grid-template-columns:52px 1fr 52px;gap:8px;align-items:center}
.stepper button{height:44px;border:1px solid #d1d5db;background:#fff;border-radius:12px;font-size:22px;font-weight:900}
.stepper .num{text-align:center;font-size:20px;font-weight:900}
.ctns .input{margin-top:6px}
.sub{border-left:3px solid #f59e0b;padding-left:12px;margin-bottom:14px}
.hint{font-size:12px;color:#9ca3af;margin-top:4px}
.save{width:100%;height:52px;border:0;border-radius:14px;background:#111827;color:#fff;font-size:16px;font-weight:900;margin-top:6px}
.save:disabled{opacity:.4}
.desc{font-size:13px;color:#6b7280;line-height:1.6;margin:-6px 0 12px}
.paste{width:100%;min-height:260px;border:1px solid #d1d5db;border-radius:12px;background:#fff;padding:12px;font-size:14px;line-height:1.6;resize:vertical}
.check{width:100%;height:48px;border:1px solid #111827;border-radius:14px;background:#fff;color:#111827;font-size:15px;font-weight:900;margin-top:10px}
.check:disabled{opacity:.5}
.result{margin-top:14px;border-top:1px solid #e5e7eb;padding-top:12px}
.result h3{margin:0 0 6px;font-size:15px;font-weight:900}
.rk{font-size:11px;color:#9ca3af;font-weight:700;margin-top:10px}
.rv{font-size:15px;font-weight:700;margin-top:2px;word-break:break-word;line-height:1.5}
.rv.none{color:#c0c4cc;font-weight:600}
.rv.bad{color:#b91c1c}
.miss{background:#fef2f2;color:#b91c1c;border-radius:12px;padding:10px 12px;font-size:14px;font-weight:700;line-height:1.7;margin-bottom:8px}
.warnbox{background:#fffbeb;color:#92400e;border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.7;margin-bottom:8px}
.alert{border-radius:12px;padding:11px 12px;font-size:14px;font-weight:700;margin-bottom:12px;display:none}
.alert.show{display:block}
.alert.ok{background:#ecfdf5;color:#047857}
.alert.warn{background:#fffbeb;color:#b45309}
.alert.err{background:#fef2f2;color:#b91c1c}

/* 실적사항 */
.tablewrap{background:#fff;border:1px solid #e5e7eb;border-radius:14px;overflow:hidden}
table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:14px}
th,td{padding:10px 4px;text-align:center;border-bottom:1px solid #f0f1f3;white-space:nowrap}
thead th{font-size:12px;color:#6b7280;background:#f8fafc;font-weight:700}
td{font-weight:800;font-variant-numeric:tabular-nums}
th.n,td.n{text-align:left;padding-left:12px;width:24%}
td.zero{color:#c0c4cc;font-weight:600}
tfoot td{background:#f8fafc;border-top:2px solid #d1d5db;border-bottom:0;font-weight:900}
.note{margin-top:12px;background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:11px 12px;font-size:13px;color:#92400e;line-height:1.6}
.note.ok{background:#f0fdf4;border-color:#bbf7d0;color:#166534}

.loading{position:fixed;inset:0;background:rgba(255,255,255,.6);display:none;align-items:center;justify-content:center;z-index:50;font-weight:800}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111827;color:#fff;padding:11px 16px;border-radius:999px;font-size:14px;font-weight:700;display:none;z-index:60;max-width:90%;text-align:center}

@media (max-width:360px){
  table{font-size:13px}
  thead th{font-size:11px;letter-spacing:-.3px}
  th.n,td.n{padding-left:8px}
}
</style>
</head>
<body>
<div class="app">

  <div class="top">
    <div class="title">관저중로점 유선 실적관리</div>
    <div class="month">
      <button type="button" onclick="moveMonth(-1)" aria-label="이전 달">◀</button>
      <div class="label" id="monthLabel">-</div>
      <button type="button" onclick="moveMonth(1)" aria-label="다음 달">▶</button>
    </div>
    <div class="tabs">
      <button type="button" class="tab active" data-tab="list" onclick="openTab('list')">개통리스트</button>
      <button type="button" class="tab" data-tab="report" onclick="openTab('report')">직원들 개통보고</button>
      <button type="button" class="tab" data-tab="stats" onclick="openTab('stats')">실적사항</button>
    </div>
  </div>

  <!-- 개통리스트 -->
  <section class="page active" id="page-list">
    <input id="search" class="search" placeholder="고객명 또는 접속번호 검색" oninput="renderList()">
    <div class="count" id="listCount"></div>
    <div id="list"></div>
    <details class="legacy" id="legacyBox">
      <summary>기존 장표 연동 상태</summary>
      <div id="legacyStatus"></div>
      <button type="button" class="check" id="statsDiagBtn" onclick="checkStatsDiag()">실적 매핑 확인 (선택 월)</button>
      <div id="statsDiag"></div>
      <button type="button" class="check" id="legacyAllBtn" onclick="checkAllLegacy()">전체 월 점검</button>
      <div id="legacyAll"></div>
    </details>
  </section>

  <!-- 직원들 개통보고 -->
  <section class="page" id="page-report">
    <div class="form">
      <h2>직원들 개통보고</h2>
      <div class="desc">직원들이 카톡 등에 작성한 유선판매보고 내용을 그대로 붙여넣어 주세요.</div>
      <div class="alert" id="formAlert"></div>
      <textarea id="reportText" class="paste" placeholder="유선판매보고 내용을 여기에 그대로 붙여넣기" oninput="onTextChange()"></textarea>
      <div class="hint" id="monthHint"></div>
      <button type="button" class="check" id="checkBtn" onclick="previewReport()">내용 확인</button>
      <div id="preview"></div>
    </div>
  </section>

  <!-- 실적사항 -->
  <section class="page" id="page-stats">
    <div class="tablewrap" id="statsTable"></div>
    <div id="statsNote"></div>
  </section>

</div>

<div class="loading" id="loading">불러오는 중...</div>
<div class="toast" id="toast"></div>

<script>
let MONTH = '';
let DATA = { list: [], workers: [], lineTypes: [], giftKinds: [], stats: null };
let SAVING = false;

function esc(v){
  return String(v == null ? '' : v)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { t.style.display = 'none'; }, 2400);
}

function showLoading(v){
  document.getElementById('loading').style.display = v ? 'flex' : 'none';
}

function monthLabel(m){
  const p = String(m || '').split('-');
  return p.length === 2 ? p[0] + '년 ' + Number(p[1]) + '월' : '-';
}

function thisMonth(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}

function moveMonth(delta){
  const p = MONTH.split('-').map(Number);
  const d = new Date(p[0], p[1] - 1 + delta, 1);
  load(d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'));
}

function openTab(name){
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('active', p.id === 'page-' + name));
  window.scrollTo(0, 0);
}

/* ===== 데이터 ===== */
function load(month, silent){
  MONTH = month;
  document.getElementById('monthLabel').textContent = monthLabel(month);
  document.getElementById('monthHint').textContent = '적용월: ' + monthLabel(month) + ' 로 저장됩니다.';
  if (!silent) showLoading(true);
  google.script.run
    .withSuccessHandler(d => {
      showLoading(false);
      if (d.month !== MONTH) return; // 늦게 도착한 이전 달 응답 무시
      DATA = d;
      renderAll();
    })
    .withFailureHandler(err => {
      showLoading(false);
      toast(err && err.message ? err.message : '불러오기 실패');
    })
    .getAppData(month);
}

function renderAll(){
  const sd = document.getElementById('statsDiag');
  if (sd) sd.innerHTML = '';
  renderList();
  renderStats();
}

/* ===== 개통리스트 ===== */
function renderList(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  // 숫자/공백/하이픈만 입력했을 때만 접속번호 숫자 비교 (고객명 검색어의 숫자로 오검색 방지)
  const qd = /^[\d\s-]+$/.test(q) ? q.replace(/\D/g, '') : '';
  const list = (DATA.list || []).filter(r => {
    if (!q) return true;
    return String(r.customerName).toLowerCase().includes(q) ||
      String(r.accessNo).toLowerCase().includes(q) ||
      (qd && String(r.accessNo).replace(/\D/g, '').includes(qd));
  });

  document.getElementById('listCount').textContent =
    monthLabel(MONTH) + ' 개통 ' + (DATA.list || []).length + '건' +
    (q ? ' · 검색 ' + list.length + '건' : '');

  const el = document.getElementById('list');
  if (!list.length) {
    el.innerHTML = '<div class="empty">' + (q ? '검색 결과가 없습니다.' : '등록된 개통건이 없습니다.') + '</div>';
    return;
  }

  el.innerHTML = list.map(r => `
    <div class="card">
      <div class="name">${esc(r.customerName || '-')}</div>
      <div class="acc">${esc(r.accessNo || '-')}</div>
      <div class="k">고객혜택</div>
      <div class="v">${esc(r.gift || '-')}</div>
      <div class="k">사은품 발송번호</div>
      <div class="v">${esc(r.giftPhone || '-')}</div>
      ${r.source === 'legacy'
        ? `<span hidden data-source="legacy" data-origin="${esc(r.sheet)} ${esc(r.row)}행"></span>`
        : `<div class="meta" data-source="webapp">${esc(r.worker)} · ${esc(r.lineType)} · ${esc(String(r.createdAt).slice(5, 16))}</div>`}
    </div>
  `).join('');
  renderLegacyStatus();
}

/* ===== 기존 장표 연동 상태 ===== */
function legacyHtml(x){
  if (!x.sheet) return `<div class="lg"><b>${esc(monthLabel(x.month || MONTH))}</b> · 기존 장표 없음 (웹앱 데이터만 표시)</div>`;
  const map = x.mapping ? x.mapping.map(m => `${esc(m.field)}: <b>${esc(m.col)}</b>${m.header ? ' (' + esc(m.header) + ')' : ''}`).join('<br>') : '';
  return `<div class="lg"><b>${esc(x.sheet)}</b> · 상태 ${esc(x.status || '-')}
    ${x.ok ? ' · 읽은 개통건 <b>' + (x.read != null ? x.read : x.count) + '건</b>' + (x.shown != null ? ' (중복 제외 표시 ' + x.shown + '건)' : '') : ''}
    ${x.ok ? '<br>' + map : '<br><span class="bad">연결 안 함: ' + esc(x.reason) + '</span>'}
    ${x.sample ? '<br><span style="color:#6b7280">첫 개통건 원본 확인: ' + esc(x.sample) + '</span>' : ''}</div>`;
}

function statsDiagHtml(d){
  if (!d) return '';
  if (!d.ok) return `<div class="lg"><b>[실적 매핑 확인] ${esc(d.sheet || monthLabel(d.month))}</b><br><span class="bad">${esc(d.reason)}</span></div>`;
  const block = (title, list) => list.length
    ? list.map(c => `${title}: <b>${esc(c.header)}</b> (${esc(c.col)}열)<br>
        <span style="color:#6b7280">발견된 값: ${c.values.map(v => esc(v.value) + ' ' + v.count + '건').join(' · ')}</span>`).join('<br>')
    : `${title}: <span class="bad">후보 없음</span>`;
  const ls = d.legacyStats;
  let statBlock = '';
  if (ls && ls.ok) {
    const keys = [['newSub', '순신규'], ['newLine', '동판순신규'], ['newDong', '신동'], ['renewLine', '동판약갱']];
    const tot = {};
    keys.forEach(k => { tot[k[0]] = ls.byWorker.reduce((a, r) => a + (Number(r[k[0]]) || 0), 0); });
    statBlock = `<br><b>실적 열(직접 집계)</b>: ${ls.cols.map(c => esc(c.field) + ' ' + esc(c.col) + '열').join(' · ')}<br>
      ${ls.byWorker.map(r => esc(r.worker) + ': ' + keys.map(k => k[1] + ' ' + r[k[0]]).join(', ')).join('<br>')}<br>
      <b>합계</b>: ${keys.map(k => k[1] + ' ' + tot[k[0]]).join(', ')}<br>
      <span style="color:#6b7280">집계 행 ${ls.rows}건 · 웹앱 보고와 겹쳐 제외 ${ls.excluded}건${ls.nonNumeric ? ' · 숫자 아닌 실적값 ' + ls.nonNumeric + '칸(0 처리)' : ''}</span>`;
  } else if (ls) {
    statBlock = `<br><span class="bad">실적 연동 오류: ${esc(ls.reason)}</span>`;
  }
  const nd = d.newSubDiag;
  let newSubBlock = '';
  if (nd) {
    const cands = (title, list) => `${title}: ` + (list && list.length
      ? list.map(c => `<b>${esc(c.header)}</b> (${esc(c.col)}열) <span style="color:#6b7280">값: ${c.values.map(v => esc(v.value) + ' ' + v.count + '건').join(' · ')}</span>`).join('<br>&nbsp;&nbsp;')
      : '<span class="bad">후보 없음</span>');
    newSubBlock = `<br><b>[순신규 회선 진단]</b> <span style="color:#9ca3af">(표시만, 실적 계산 변경 없음)</span><br>
      ${cands('구분', nd.candidates.gubun)}<br>
      ${cands('판매자', nd.candidates.seller)}<br>
      ${cands('인터넷(I) 후보', nd.candidates.internet)}<br>
      ${cands('TV(T) 후보', nd.candidates.tv)}<br>
      ${cands('GTT 후보', nd.candidates.gtt)}<br>
      ${nd.samples.length
        ? '<b>구분=순신규 샘플 (최대 5건)</b><br>' + nd.samples.map(x =>
            `${x.row}행 / 판매자 ${esc(x.seller)} / 구분 ${esc(x.gubun)} / I ${esc(x.internet)} / T ${esc(x.tv)} / GTT ${esc(x.gtt)}`).join('<br>')
        : '<span class="bad">' + esc(nd.note) + '</span>'}`;
  }
  return `<div class="lg"><b>[실적 매핑 확인] ${esc(d.sheet)}</b> · 개통건 ${d.rows}건<br>
    ${block('담당자 헤더', d.staff)}<br>
    ${block('실적유형 후보 헤더', d.types)}
    ${statBlock}${newSubBlock}</div>`;
}

function checkStatsDiag(){
  const btn = document.getElementById('statsDiagBtn');
  btn.disabled = true;
  btn.textContent = '확인 중...';
  google.script.run
    .withSuccessHandler(d => {
      btn.disabled = false;
      btn.textContent = '실적 매핑 확인 (선택 월)';
      document.getElementById('statsDiag').innerHTML = statsDiagHtml(d);
    })
    .withFailureHandler(err => {
      btn.disabled = false;
      btn.textContent = '실적 매핑 확인 (선택 월)';
      toast(err && err.message ? err.message : '확인 실패');
    })
    .getLegacyStatsDiag(MONTH);
}

function renderLegacyStatus(){
  const l = DATA.legacy;
  document.getElementById('legacyStatus').innerHTML = l ? legacyHtml(Object.assign({ month: MONTH }, l)) : '';
}

function checkAllLegacy(){
  const btn = document.getElementById('legacyAllBtn');
  btn.disabled = true;
  btn.textContent = '점검 중...';
  google.script.run
    .withSuccessHandler(list => {
      btn.disabled = false;
      btn.textContent = '전체 월 점검';
      document.getElementById('legacyAll').innerHTML = list.length
        ? list.map(x => legacyHtml(x) + statsDiagHtml(x.stats)).join('')
        : '<div class="lg">기존 월별 장표가 없습니다.</div>';
    })
    .withFailureHandler(err => {
      btn.disabled = false;
      btn.textContent = '전체 월 점검';
      toast(err && err.message ? err.message : '점검 실패');
    })
    .getLegacyStatus();
}

/* ===== 직원들 개통보고 (붙여넣기) ===== */
let PREVIEW = null;

function showAlert(type, msg){
  const a = document.getElementById('formAlert');
  if (!msg) { a.className = 'alert'; a.textContent = ''; return; }
  a.className = 'alert show ' + type;
  a.textContent = msg;
}

function onTextChange(){
  // 내용이 바뀌면 이전 분석 결과로 저장하지 않도록 초기화
  if (PREVIEW) {
    PREVIEW = null;
    document.getElementById('preview').innerHTML = '';
  }
  showAlert('', '');
}

function rv(v, bad){
  const s = String(v == null ? '' : v).trim();
  return s ? `<div class="rv">${esc(s)}</div>` : `<div class="rv ${bad ? 'bad' : 'none'}">${bad ? '확인 못함' : '-'}</div>`;
}

function previewReport(){
  const text = document.getElementById('reportText').value;
  if (!text.trim()) return showAlert('err', '유선판매보고 내용을 붙여넣어 주세요.');
  const btn = document.getElementById('checkBtn');
  btn.disabled = true;
  btn.textContent = '분석 중...';
  showAlert('', '');
  const sentText = text;
  const sentMonth = MONTH;
  google.script.run
    .withSuccessHandler(r => {
      btn.disabled = false;
      btn.textContent = '내용 확인';
      if (document.getElementById('reportText').value !== sentText) return; // 분석 중 내용이 바뀜
      PREVIEW = { text: sentText, month: sentMonth, result: r };
      renderPreview(r);
    })
    .withFailureHandler(err => {
      btn.disabled = false;
      btn.textContent = '내용 확인';
      showAlert('err', err && err.message ? err.message : '분석에 실패했습니다.');
    })
    .previewReport({ month: MONTH, text: text });
}

function renderPreview(r){
  const f = r.fields;
  const items = [
    ['작업자', f.worker, true],
    ['동판유형', f.lineType, true],
    ['접속번호', f.accessNo, true],
    ['인터넷 명의자', f.customerName, true],
    ['핸드폰 명의자', f.holderPhone],
    ['동판회선', f.lineCount + '회선' + (f.lineCtns.length ? '\n' + f.lineCtns.join('\n') : '')],
    ['(불일치시) 내용안내방법', f.guideMethod],
    ['(불일치시) 참고사항', f.mismatchNote],
    ['(불일치시) 연락처', f.mismatchPhone],
    ['지급사은품', f.gift],
    ['사은품발송번호', f.giftPhone],
    ['사은품권종', f.giftKind],
    ['사은품처리방식', f.giftProcess],
    ['GTT', f.gtt],
    ['GTT처리방식', f.gttProcess]
  ];
  document.getElementById('preview').innerHTML = `
    <div class="result">
      <h3>[분석 결과] · 적용월 ${esc(monthLabel(PREVIEW.month))}</h3>
      ${r.missing.length ? `<div class="miss">${r.missing.map(m => '⚠️ ' + esc(m)).join('<br>')}</div>` : ''}
      ${r.duplicate ? `<div class="miss">⚠️ 동일한 접속번호의 개통보고가 이미 존재합니다.</div>` : ''}
      ${r.warnings.length ? `<div class="warnbox">${r.warnings.map(w => '· ' + esc(w)).join('<br>')}</div>` : ''}
      ${items.map(it => `<div class="rk">${esc(it[0])}</div>${rv(it[1], it[2]).replace(/\n/g, '<br>')}`).join('')}
      <button type="button" class="save" id="saveBtn" onclick="saveReport()" ${r.canSave ? '' : 'disabled'}>개통보고 저장</button>
    </div>`;
}

function saveReport(){
  if (SAVING || !PREVIEW || !PREVIEW.result.canSave) return;
  if (PREVIEW.month !== MONTH) {
    PREVIEW = null;
    document.getElementById('preview').innerHTML = '';
    return showAlert('warn', '적용월이 바뀌었습니다. [내용 확인]을 다시 눌러주세요.');
  }

  SAVING = true;
  const btn = document.getElementById('saveBtn');
  btn.disabled = true;
  btn.textContent = '저장 중...';
  showAlert('warn', '저장 중...');

  google.script.run
    .withSuccessHandler(r => {
      SAVING = false;
      if (r && r.duplicate) {
        btn.textContent = '개통보고 저장';
        showAlert('warn', r.message);
        return;
      }
      showAlert('ok', '유선판매보고가 저장되었습니다.');
      toast('유선판매보고가 저장되었습니다.');
      document.getElementById('reportText').value = '';
      document.getElementById('preview').innerHTML = '';
      PREVIEW = null;
      load(MONTH, true);
    })
    .withFailureHandler(err => {
      SAVING = false;
      btn.disabled = false;
      btn.textContent = '개통보고 저장';
      showAlert('err', err && err.message ? err.message : '저장에 실패했습니다.');
    })
    .saveReportText({ month: PREVIEW.month, text: PREVIEW.text });
}

/* ===== 실적사항 ===== */
function renderStats(){
  const s = DATA.stats;
  if (!s) return;
  const cell = v => `<td class="${v ? '' : 'zero'}">${v}</td>`;
  document.getElementById('statsTable').innerHTML = `
    <table>
      <thead><tr>
        <th class="n">직원</th>
        ${s.metrics.map(m => `<th>${esc(m.title.replace('실적', ''))}</th>`).join('')}
      </tr></thead>
      <tbody>
        ${s.rows.map(r => `<tr><td class="n">${esc(r.worker)}</td>${s.metrics.map(m => cell(r[m.key])).join('')}</tr>`).join('')}
      </tbody>
      <tfoot><tr>
        <td class="n">합계</td>${s.metrics.map(m => `<td>${s.total[m.key]}</td>`).join('')}
      </tr></tfoot>
    </table>`;

  const note = document.getElementById('statsNote');
  const ls = DATA.legacyStats;
  const legacyLine = !ls ? '' : ls.ok
    ? `<div class="note ok">기존 장표(${esc(ls.sheet)}) 실적 포함${ls.excluded ? ' · 웹앱 보고와 겹친 ' + ls.excluded + '건은 웹앱 기준' : ''}</div>`
    : `<div class="note">기존 장표 실적 연동 오류: ${esc(ls.reason)} — 웹앱 보고만 집계했습니다.</div>`;
  const webCount = (DATA.list || []).filter(r => r.source === 'webapp').length;
  if (s.unclassifiedCount) {
    note.innerHTML = legacyLine + `<div class="note">
      웹앱 보고 중 미분류 동판유형 <b>${s.unclassifiedCount}건</b> — 집계에서 빠져 있습니다.<br>
      ${s.unclassifiedTypes.map(t => esc(t.type) + ' ' + t.count + '건').join(' · ')}<br>
      '유선_설정' 시트에서 분류값을 입력하면 자동으로 다시 계산됩니다.
    </div>`;
  } else {
    note.innerHTML = legacyLine + (webCount
      ? '<div class="note ok">웹앱 보고가 모두 분류되어 집계되었습니다.</div>'
      : '');
  }
}

document.addEventListener('DOMContentLoaded', () => {
  load(thisMonth());
});
</script>
