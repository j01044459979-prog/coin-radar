<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<title>리치 베팅 장부</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root { --bg:#f4f5f7; --card:#fff; --ink:#1b1f24; --sub:#6b7280; --line:#e2e5ea; --pri:#2457d6; --up:#d62d2d; --down:#1c6ddb; --warn:#b45309; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111418; --card:#1a1f26; --ink:#eef0f3; --sub:#9aa3af; --line:#2c333d; --pri:#6c93ff; --up:#ff6b6b; --down:#6aa8ff; --warn:#f0a95b; }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.4 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif; padding:0 12px 80px; max-width:640px; margin:0 auto; }
  h1 { font-size:18px; margin:12px 0 8px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:10px; }
  .num { font-variant-numeric:tabular-nums; font-weight:700; }
  .row { display:flex; justify-content:space-between; align-items:baseline; gap:8px; padding:2px 0; }
  .sub { color:var(--sub); font-size:13px; }
  .bar { height:8px; background:var(--line); border-radius:4px; overflow:hidden; margin:6px 0; }
  .bar > i { display:block; height:100%; background:var(--pri); }
  .bar.over > i { background:var(--up); }
  .plus { color:var(--up); } .minus { color:var(--down); }
  .nav { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:10px; }
  .nav button { padding:14px 4px; font-size:16px; font-weight:700; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:10px; }
  .nav .wide { grid-column:1 / -1; }
  .buybtns { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px; }
  .buybtns button { padding:14px 0; font-size:17px; font-weight:800; border:0; border-radius:10px; color:#fff; }
  .buybtns .yes { background:var(--pri); } .buybtns .no { background:#6b7280; }
  .buybtns button:disabled { opacity:.5; }
  .nav button.on { background:var(--pri); color:#fff; border-color:var(--pri); }
  label { display:block; font-size:13px; color:var(--sub); margin:10px 0 4px; }
  input, select, textarea { width:100%; font-size:17px; padding:11px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--ink); }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .big { width:100%; margin-top:14px; padding:16px; font-size:18px; font-weight:800; border:0; border-radius:12px; background:var(--pri); color:#fff; }
  .big:disabled, .mini:disabled { opacity:.5; }
  .mini { padding:10px 14px; font-weight:700; border:0; border-radius:8px; background:var(--pri); color:#fff; font-size:15px; }
  .msg { margin-top:10px; padding:10px; border-radius:8px; font-size:15px; display:none; }
  .msg.ok { display:block; background:#e6f6ea; color:#14532d; }
  .msg.err { display:block; background:#fde8e8; color:#7f1d1d; }
  .games { display:grid; gap:6px; margin-top:6px; }
  .g { display:grid; grid-template-columns:44px 1fr 1fr 1fr; gap:6px; align-items:center; }
  .g span { font-size:14px; color:var(--sub); }
  .g button { padding:10px 0; font-size:17px; font-weight:700; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--ink); }
  .g button.on { background:var(--pri); color:#fff; border-color:var(--pri); }
  .scroll { overflow-x:auto; }
  table { border-collapse:collapse; width:100%; min-width:460px; font-size:14px; }
  th, td { padding:7px 6px; border-bottom:1px solid var(--line); text-align:right; white-space:nowrap; }
  th:first-child, td:first-child { text-align:left; }
  th { color:var(--sub); font-weight:600; }
  h2 { font-size:15px; margin:14px 0 6px; }
  .grid3 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .stat .v { font-size:20px; }
  .pend { overflow-wrap:anywhere; word-break:break-word; }
  .pend { border-top:1px solid var(--line); padding-top:10px; margin-top:10px; }
  .pend:first-child { border-top:0; margin-top:0; padding-top:0; }
  .hidden { display:none; }
  .grp { border-top:1px solid var(--line); margin-top:10px; padding-top:10px; }
  .grp:first-child { border-top:0; margin-top:0; padding-top:0; }
  .grp .pend { border-top:1px dashed var(--line); }
  .top { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .refresh { padding:6px 10px; font-size:13px; font-weight:700; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:8px; }
  .refresh:disabled { opacity:.5; }
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:flex-end; justify-content:center; z-index:50; }
  .modal.hidden { display:none; }
  .sheet { background:var(--card); color:var(--ink); width:100%; max-width:640px; border-radius:16px 16px 0 0; padding:16px 16px calc(16px + env(safe-area-inset-bottom)); overflow-wrap:anywhere; }
  .sheet h3 { margin:0 0 8px; font-size:17px; }
  .sheet .ln { margin:4px 0; }
  .sheet .actions { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:14px; }
  .sheet .actions button { padding:15px 0; font-size:17px; font-weight:800; border:0; border-radius:10px; }
  .sheet .back { background:var(--line); color:var(--ink); } .sheet .ok { background:var(--pri); color:#fff; }
  .sheet .actions button:disabled { opacity:.5; }
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:#14532d; color:#fff; padding:10px 16px; border-radius:20px; font-size:15px; z-index:60; max-width:90%; display:none; }
</style>
</head>
<body>
<h1>리치 베팅 장부</h1>

<div class="card" id="head">
  <div class="top"><div class="sub" id="hMonth">불러오는 중…</div><button class="refresh" id="btnRefresh" type="button">↻ 새로고침</button></div>
  <div class="row"><span>실제 사용액</span><span class="num"><span id="hUsed">-</span> / <span id="hBudget">-</span></span></div>
  <div class="bar" id="hBar"><i style="width:0"></i></div>
  <div class="row"><span>남은 예산</span><span class="num" id="hRemain">-</span></div>
  <div class="row"><span>확정 손익</span><span class="num" id="hProfit">-</span></div>
  <div class="row"><span>확정 ROI</span><span class="num" id="hRoi">-</span></div>
  <div class="sub" id="hPend"></div>
</div>

<div class="nav">
  <button data-tab="buy" class="on wide" id="navBuy">구매 확인</button>
  <button data-tab="res">결과 처리</button>
  <button data-tab="mon">월간 성적</button>
</div>

<!-- 구매 확인 -->
<section id="tab-buy">
  <div class="card"><h2 style="margin-top:0">리치 추천픽 (구매 미확인)</h2><div id="uBody" class="sub">불러오는 중…</div></div>
</section>

<!-- 결과 처리 -->
<section id="tab-res" class="hidden">
  <div class="card"><h2 style="margin-top:0">일반 토토 (대기)</h2><div id="pBets" class="sub">불러오는 중…</div></div>
  <div class="card"><h2 style="margin-top:0">승무패 (대기)</h2><div id="pWdl" class="sub">불러오는 중…</div></div>
</section>

<!-- 월간 성적 -->
<section id="tab-mon" class="hidden">
  <div class="card"><label style="margin-top:0">월 선택</label><input type="month" id="mMonth"></div>
  <div id="mBody" class="sub">불러오는 중…</div>
</section>

<div id="cfm" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="cfmTitle">
  <div class="sheet">
    <h3 id="cfmTitle"></h3>
    <div id="cfmText"></div>
    <div id="cfmErr" class="msg err"></div>
    <div class="actions"><button type="button" class="back" id="cfmBack">돌아가기</button><button type="button" class="ok" id="cfmOk"></button></div>
  </div>
</div>
<div id="toast" class="toast" role="status"></div>

<script>
var S = { month:'', summary:null, tab:'buy', busy:{}, cache:{}, inflight:{}, modal:null };
var TTL = 60000;                 // 같은 탭 재방문 시 이 시간 안이면 서버 재호출 없음
var $ = function (id) { return document.getElementById(id); };

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function won(n) { return Math.round(n).toLocaleString('ko-KR') + '원'; }
function signed(n) { return (n > 0 ? '+' : n < 0 ? '-' : '') + Math.abs(Math.round(n)).toLocaleString('ko-KR') + '원'; }
function pct(n) { return n === null || n === undefined ? '-' : n.toFixed(1) + '%'; }
function spct(n) { return (n > 0 ? '+' : n < 0 ? '-' : '') + Math.abs(n).toFixed(1) + '%'; }
function plainText(html) { var d = document.createElement('div'); d.innerHTML = html; return d.textContent; }
function cls(n) { return n > 0 ? 'plus' : n < 0 ? 'minus' : ''; }
function reqId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 10); }

function call(fn, arg) {
  return new Promise(function (resolve) {
    var r = google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(function (e) { resolve({ ok:false, error:(e && e.message) || '서버 연결 오류' }); });
    arg === undefined ? r[fn]() : r[fn](arg);
  });
}

/* 같은 요청이 진행 중이면 새로 호출하지 않고 같은 Promise 를 돌려준다 */
function fetchOnce(key, fn, arg) {
  if (S.inflight[key]) return S.inflight[key];
  var p = call(fn, arg).then(function (r) { delete S.inflight[key]; return r; });
  S.inflight[key] = p;
  return p;
}
function isFresh(tab) { var c = S.cache[tab]; return !!c && Date.now() - c.at < TTL; }
function markStale() { for (var i = 0; i < arguments.length; i++) delete S.cache[arguments[i]]; }

var toastTimer = null;
function toast(msg) {
  var t = $('toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.style.display = 'none'; }, 2500);
}

function renderHead(s) {
  S.summary = s;
  $('hMonth').textContent = '이번달 ' + S.month;
  $('hUsed').textContent = won(s.used);
  $('hBudget').textContent = won(s.budget);
  var ratio = s.budget ? Math.min(100, s.used / s.budget * 100) : 0;
  $('hBar').className = 'bar' + (s.used > s.budget ? ' over' : '');
  $('hBar').firstChild.style.width = ratio + '%';
  $('hRemain').textContent = won(s.remain);
  $('hProfit').textContent = signed(s.profit); $('hProfit').className = 'num ' + cls(s.profit);
  $('hRoi').textContent = spct(s.roi); $('hRoi').className = 'num ' + cls(s.roi);
  $('hPend').textContent = '미확정 ' + won(s.pendingStake) + ' · 확정 베팅액 ' + won(s.settledStake);
}
function applyMeta(meta) { if (meta) { S.month = meta.month; renderHead(meta.summary); } }

/* ---------- 확인창 (상태 변경은 항상 2단계) ---------- */
function openConfirm(o) {   // o: { title, lines[], okLabel, run(reqId) -> Promise<res>, onSuccess(res) }
  if (S.modal) return;
  S.modal = { o: o, reqId: reqId(), busy: false };
  $('cfmTitle').textContent = o.title;
  $('cfmText').innerHTML = o.lines.map(function (l) { return '<div class="ln">' + esc(l) + '</div>'; }).join('');
  $('cfmErr').className = 'msg err'; $('cfmErr').textContent = '';
  $('cfmOk').textContent = o.okLabel; $('cfmOk').disabled = false; $('cfmBack').disabled = false;
  $('cfm').classList.remove('hidden');
  $('cfmBack').focus();
}
function closeConfirm() { if (S.modal && S.modal.busy) return; S.modal = null; $('cfm').classList.add('hidden'); }
$('cfmBack').addEventListener('click', closeConfirm);
$('cfm').addEventListener('click', function (e) { if (e.target === $('cfm')) closeConfirm(); });
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeConfirm(); });
$('cfmOk').addEventListener('click', function () {
  var m = S.modal;
  if (!m || m.busy) return;                       // 처리 중 연타 차단 (동기 플래그)
  m.busy = true; $('cfmOk').disabled = true; $('cfmBack').disabled = true; $('cfmOk').textContent = '처리 중…';
  m.o.run(m.reqId).then(function (res) {
    m.busy = false;
    if (res.ok) {
      S.modal = null; $('cfm').classList.add('hidden');
      if (res.summary) renderHead(res.summary);
      m.o.onSuccess(res);
    } else {
      $('cfmErr').className = 'msg err'; $('cfmErr').textContent = '✖ ' + res.error;
      $('cfmOk').disabled = false; $('cfmBack').disabled = false; $('cfmOk').textContent = m.o.okLabel;
    }
  });
});

/* ---------- 탭 ---------- */
function showTab(t) {
  S.tab = t;
  document.querySelectorAll('.nav button').forEach(function (x) { x.classList.toggle('on', x.dataset.tab === t); });
  ['buy', 'res', 'mon'].forEach(function (k) { $('tab-' + k).classList.toggle('hidden', k !== t); });
  return loadTab(t, false);
}
function loadTab(t, force) {
  if (!force && isFresh(t)) return Promise.resolve();
  if (t === 'buy') return loadUnconfirmed();
  if (t === 'res') return loadPending();
  return loadMonthly();
}
document.querySelectorAll('.nav button').forEach(function (b) {
  b.addEventListener('click', function () { showTab(b.dataset.tab); });
});
$('btnRefresh').addEventListener('click', function () {
  var b = $('btnRefresh'); b.disabled = true;
  loadTab(S.tab, true).then(function () { b.disabled = false; });
});
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible' && !S.modal && !isFresh(S.tab)) loadTab(S.tab, false);
});

/* ---------- 구매 확인 ---------- */
function buyCount() { return document.querySelectorAll('#uBody .pend').length; }
function updateBuyBadge() {
  var n = buyCount();
  $('navBuy').textContent = '구매 확인' + (n ? ' (' + n + ')' : '');
  if (!n) $('uBody').textContent = '구매 확인할 추천픽이 없습니다.';
}
function loadUnconfirmed() {
  return fetchOnce('buy', 'apiGetUnconfirmed').then(function (res) {
    if (!res.ok) { $('uBody').textContent = '불러오기 실패: ' + res.error; return; }
    applyMeta(res.meta);
    $('mMonth').value = $('mMonth').value || S.month;
    function item(kind, id, top, pick, line, count) {
      return '<div class="pend" data-kind="' + kind + '" data-id="' + esc(id) + '" data-count="' + (count || '') + '" data-top=""' + esc(top) + '" data-pick="' + esc(pick) + '" data-line="' + esc(plainText(line.replace(/<br>/g, ' · '))) + '">' +
        '<div><b>' + esc(top) + '</b></div><div>' + esc(pick) + '</div><div class="sub">' + line + '</div>' +
        '<div class="buybtns"><button class="yes" data-buy="1">샀다</button><button class="no" data-buy="0">안 샀다</button></div></div>';
    }
    var html = res.bets.map(function (r) {
      return item('bet', r.id, r.name, r.pick || '-',
        esc(r.date) + ' · ' + esc(r.sport) + (r.league ? '/' + esc(r.league) : '') + '<br>총배당 ' + r.odds + ' · 추천금액 ' + won(r.stake) + ' · ' + esc(r.grade));
    }).concat(res.wdl.map(function (r) {
      if (r.kind === 'wdl_group') {   // 복수마킹 묶음: 여러 행이어도 카드는 한 장
        var multi = r.multi.map(function (m) { return m.game + '번 ' + m.picks.join('/'); }).join(' · ');
        return item('wdl_group', r.groupId, '승무패 ' + r.round + '회차', r.comboCount + '조합 · 총 추천금액 ' + won(r.stake),
          '복수마킹: ' + esc(multi || '없음') + '<br>' + esc(r.date) + ' · 조합당 ' + won(r.stakePerCombo), r.comboCount);
      }
      var picks = r.picks.split('').map(function (c, i) { return (i + 1) + c; }).join(' ');
      return item('wdl', r.id, r.round + '회차 · ' + r.combo, picks, esc(r.date) + ' · 추천금액 ' + won(r.stake));
    })).join('');
    $('uBody').innerHTML = html;
    S.cache.buy = { at: Date.now() };
    updateBuyBadge();
  });
}
/* 첫 터치는 확인창만 연다. 서버 호출은 확인창의 '확정' 버튼에서만. */
$('tab-buy').addEventListener('click', function (e) {
  var btn = e.target.closest('button[data-buy]'); if (!btn) return;
  var box = btn.closest('.pend'); if (!box) return;
  var buy = btn.dataset.buy === '1';
  openConfirm({
    title: buy ? '구매 처리 확인' : '미구매 처리 확인',
    lines: [box.dataset.top, box.dataset.pick, box.dataset.line].concat(box.dataset.count ? ['※ ' + box.dataset.count + '조합 전체가 한 번에 처리됩니다.'] : [],
      [buy ? '실제로 구매하셨나요?' : '구매하지 않은 것으로 기록할까요?']),
    okLabel: buy ? '샀다 확정' : '안 샀다 확정',
    run: function (rid) { return call('apiPurchase', { kind: box.dataset.kind, id: box.dataset.id, buy: buy, reqId: rid }); },
    onSuccess: function (res) {
      if (box.parentNode) box.parentNode.removeChild(box);      // 해당 카드만 갱신 (전체 재렌더/재호출 없음)
      updateBuyBadge();
      markStale('res', 'mon');
      toast('✔ ' + res.message);
    }
  });
});

/* ---------- 결과 처리 (수동 fallback — 자동 처리와 같은 서버 로직 사용) ---------- */
function updatePendEmpty() {
  if (!$('pBets').querySelector('.pend')) $('pBets').textContent = '대기 중인 기록이 없습니다.';
  if (!$('pWdl').querySelector('.pend')) $('pWdl').textContent = '대기 중인 기록이 없습니다.';
}
function loadPending() {
  return fetchOnce('res', 'apiGetPending').then(function (res) {
    if (!res.ok) { $('pBets').textContent = '불러오기 실패: ' + res.error; return; }
    applyMeta(res.meta);
    $('pBets').innerHTML = res.bets.length ? res.bets.map(function (r) {
      return '<div class="pend" data-kind="bet" data-id="' + esc(r.id) + '" data-top="' + esc(r.name) + '">' +
        '<div><b>' + esc(r.name) + '</b></div>' +
        '<div class="sub">' + esc(r.date) + ' · ' + esc(r.sport) + ' · ' + esc(r.pick) + ' · ' + r.odds + '배 · ' + won(r.stake) + ' · ' + esc(r.grade) + ' · <b>' + esc(r.buy) + '</b></div>' +
        '<div class="two"><select class="rRes"><option>적중</option><option>미적중</option><option>적특</option><option>취소</option></select>' +
        '<input class="rRet" type="number" inputmode="numeric" min="0" placeholder="반환금(원금 포함)" data-stake="' + r.stake + '"></div>' +
        '<button class="mini rBetSave" style="margin-top:8px;width:100%">결과 저장</button></div>';
    }).join('') : '대기 중인 기록이 없습니다.';
    function wdlForm(id, top, label, sub) {   // 조합 하나의 결과 입력 폼 (단일/묶음 공용)
      return '<div class="pend" data-kind="wdl" data-id="' + esc(id) + '" data-top="' + esc(top) + '">' +
        '<div><b>' + esc(label) + '</b></div><div class="sub">' + sub + '</div>' +
        '<div class="two"><select class="wHits">' + Array.apply(null, Array(15)).map(function (_, i) { return '<option value="' + i + '">' + i + '개 적중</option>'; }).join('') + '</select>' +
        '<select class="wRank"><option>미당첨</option><option>1등</option><option>2등</option><option>3등</option><option>4등</option><option>취소</option></select></div>' +
        '<input class="wPrize" type="number" inputmode="numeric" min="0" placeholder="당첨금(원)" style="margin-top:8px">' +
        '<button class="mini rWdlSave" style="margin-top:8px;width:100%">결과 저장</button></div>';
    }
    $('pWdl').innerHTML = res.wdl.length ? res.wdl.map(function (r) {
      if (r.kind === 'wdl_group') {   // 묶음: 조합마다 독립된 결과 입력 (결과를 합치지 않음)
        return '<div class="grp"><div class="sub"><b>' + esc(r.round) + '회차 · ' + r.comboCount + '조합 대기 · ' + esc(r.buy) + '</b> · ' + esc(r.date) + ' · 합계 ' + won(r.stake) + '</div>' +
          r.combos.map(function (c) { return wdlForm(c.id, r.round + '회차 · ' + c.label, c.label, won(c.stake)); }).join('') + '</div>';
      }
      return wdlForm(r.id, r.round + '회차 · ' + r.combo, r.round + '회차 · ' + r.combo, esc(r.date) + ' · ' + won(r.stake) + ' · <b>' + esc(r.buy) + '</b>');
    }).join('') : '대기 중인 기록이 없습니다.';
    S.cache.res = { at: Date.now() };
  });
}
$('tab-res').addEventListener('change', function (e) {   // 승무패 '취소' 선택 시 적중개수/당첨금 입력 숨김
  if (!e.target.classList || !e.target.classList.contains('wRank')) return;
  var box = e.target.closest('.pend'), off = e.target.value === '취소';
  box.querySelector('.wHits').style.display = off ? 'none' : ''; box.querySelector('.wPrize').style.display = off ? 'none' : '';
});
$('tab-res').addEventListener('click', function (e) {
  var btn = e.target.closest('button'); if (!btn) return;
  var box = btn.closest('.pend'); if (!box) return;
  var id = box.dataset.id, grp = box.closest('.grp'), done = function (res) {
    if (box.parentNode) box.parentNode.removeChild(box);
    if (grp && !grp.querySelector('.pend') && grp.parentNode) grp.parentNode.removeChild(grp);   // 묶음의 마지막 조합까지 끝나면 묶음 헤더도 제거
    updatePendEmpty(); markStale('mon');
    toast('✔ 손익 ' + signed(res.profit) + (res.roi !== undefined ? ' / ROI ' + spct(res.roi) : ''));
  };
  if (btn.classList.contains('rBetSave')) {
    var sel = box.querySelector('.rRes').value, retEl = box.querySelector('.rRet');
    var ret = retEl.value;
    if (ret === '' && sel === '취소') ret = retEl.dataset.stake;   // 취소는 원금 환급이 기본
    if (ret === '' && sel === '미적중') ret = '0';
    openConfirm({
      title: '결과 처리 확인',
      lines: [box.dataset.top, '처리 결과: ' + sel, ret === '' ? '' : '반환금 ' + won(+ret)].filter(Boolean),
      okLabel: sel + ' 확정',
      run: function (rid) { return call('apiResolveBet', { id: id, result: sel, ret: ret, reqId: rid }); },
      onSuccess: done
    });
  } else if (btn.classList.contains('rWdlSave')) {
    var hits = box.querySelector('.wHits').value, rank = box.querySelector('.wRank').value, prize = box.querySelector('.wPrize').value;
    if (prize === '' && rank === '미당첨') prize = '0';
    if (rank === '취소') { hits = ''; prize = ''; }   // 취소/전액환불: 적중개수·당첨금 입력 없음(원금 전액 환급, 손익 0)
    openConfirm({
      title: '결과 처리 확인',
      lines: [box.dataset.top, rank === '취소' ? '처리 결과: 취소 · 실제 베팅금액 전액 환불(손익 0원)' : '처리 결과: ' + hits + '개 적중 / ' + rank, prize === '' ? '' : '당첨금 ' + won(+prize)].filter(Boolean),
      okLabel: rank + ' 확정',
      run: function (rid) { return call('apiResolveWdl', { id: id, hits: hits, rank: rank, prize: prize, reqId: rid }); },
      onSuccess: done
    });
  }
});

/* ---------- 월간 성적 ---------- */
$('mMonth').addEventListener('change', function () { markStale('mon'); loadMonthly(); });
function loadMonthly() {
  var m = $('mMonth').value || S.month;
  return fetchOnce('mon:' + m, 'apiGetMonthly', m).then(function (res) {
    if (!res.ok) { $('mBody').textContent = res.error; return; }
    if (res.month === S.month) renderHead(res.summary);
    var s = res.summary;
    function stat(l, v, c) { return '<div class="card stat"><div class="sub">' + l + '</div><div class="v num ' + (c || '') + '">' + v + '</div></div>'; }
    function tbl(title, cols, rows) {
      return '<h2>' + title + '</h2><div class="card scroll"><table><tr>' + cols.map(function (c) { return '<th>' + c + '</th>'; }).join('') + '</tr>' +
        rows.map(function (r) { return '<tr>' + r.map(function (c) { return '<td>' + c + '</td>'; }).join('') + '</tr>'; }).join('') + '</table></div>';
    }
    function pc(v, f) { return '<span class="' + cls(v) + '">' + f(v) + '</span>'; }
    var w = res.wdl;
    $('mBody').innerHTML =
      '<div class="grid3">' +
      stat('총 베팅액', won(s.totalStake)) + stat('남은 예산', won(s.remain)) +
      stat('미확정 베팅액', won(s.pendingStake)) + stat('확정 베팅액', won(s.settledStake)) +
      stat('총 반환금(확정)', won(s.totalReturn)) + stat('적중률', pct(s.hitRate)) +
      stat('확정 손익', signed(s.profit), cls(s.profit)) + stat('확정 ROI', spct(s.roi), cls(s.roi)) + '</div>' +
      '<div class="sub">확정 손익·ROI 는 결과가 확정된 건만 계산합니다(대기 제외).</div>' +
      tbl('종목별', ['종목', '횟수', '베팅금액', '반환금', '손익', 'ROI'], res.bySport.map(function (g) {
        return [esc(g.label), g.count, won(g.stake), won(g.ret), pc(g.profit, signed), pc(g.roi, spct)]; })) +
      tbl('폴더수별', ['폴더', '횟수', '적중률', '손익', 'ROI'], res.byFolder.map(function (g) {
        return [esc(g.label), g.count, pct(g.hitRate), pc(g.profit, signed), pc(g.roi, spct)]; })) +
      tbl('메인픽 / 대박픽', ['등급', '횟수', '적중률', '손익', 'ROI'], res.byGrade.map(function (g) {
        return [esc(g.label), g.count, pct(g.hitRate), pc(g.profit, signed), pc(g.roi, spct)]; })) +
      tbl('승무패', ['회차수', '투입금', '당첨금', '순손익', '최고적중', '최고등수'], [[w.rounds, won(w.stake), won(w.prize),
        pc(w.profit, signed), w.bestHits === null ? '-' : w.bestHits + '개', w.bestRank || '-']]) +
      tbl('승무패 묶음', ['회차', '조합수', '투입금', '최고적중', '당첨조합', '총당첨금'], res.wdlGroups.map(function (g) {
        return [esc(g.round), g.comboCount, won(g.stake), g.bestHits === null ? '-' : g.bestHits + '/14', g.settled ? g.winners + '/' + g.comboCount : '-', g.settled ? won(g.prize) : '-']; })) +
      tbl('최근 기록 10개', ['날짜', '구분', '내용', '금액', '상태', '손익'], res.recent.map(function (r) {
        return [esc(r.date.slice(5)), esc(r.kind), esc(r.title), won(r.stake), esc(r.status), r.profit === null ? '-' : pc(r.profit, signed)]; }));
    S.cache.mon = { at: Date.now() };
  });
}

/* ---------- 시작: 호출 1회 (구매 확인 목록 + 상단 요약) ---------- */
loadUnconfirmed();
